  const err = document.getElementById('f-err');
  const title = { en:val('f-title'), zh:val('f-title-zh'), tl:val('f-title-tl') };
  const body = { en:val('f-body'), zh:val('f-body-zh'), tl:val('f-body-tl') };
  if (!title.en){ err.textContent = t('need'); return; }
  const K = ED.kind, ev = K==='event';
  if (K!=='news' && !val('f-date')){ err.textContent = t('needDate'); return; }
  if (K==='sermon' && !val('f-fb')){ err.textContent = t('needLink'); return; }
  if (val('f-fb') && !linkOk(val('f-fb'))){ err.textContent = t('eBAD_LINK'); return; }
  const rec = { id: ED.id || '', kind: K, title, body, church: val('f-church') || 'all', pinned: ED.pinned, until: ED.pinned ? val('f-until') : '',
    date: K!=='news' ? val('f-date') : '', endDate: ev ? val('f-enddate') : '',
    start: ev ? val('f-start') : '', end: ev ? val('f-end') : '', deadline: ev ? val('f-deadline') : '', fb: val('f-fb') };
  const saved = await withBusy(async () => { rec.img = await upImg(); return api('api_savePost', CODE, rec); });
  if (!saved) return;
  if (saved.date && saved.kind==='event'){ S.sel = saved.date; const d = new Date(saved.date+'T00:00:00'); S.ym = [d.getFullYear(), d.getMonth()]; }
  closeSheet(); toast(saved.kind==='event' ? t('savedCal') : t('saved')); await reload();
}
async function delItem(){
  const ok = await withBusy(() => api('api_deletePost', CODE, ED.id));
  if (ok === null) return;
  closeSheet(); toast(t('deleted')); await reload();
}
async function saveArt(){
  if (!val('f-title')){ document.getElementById('f-err').textContent = t('need'); return; }
  const rec = { id: ED.id || '', church: val('f-church')||'all', cat: val('f-cat'), author: val('f-author'),
    title:{en:val('f-title'), zh:val('f-title-zh'), tl:val('f-title-tl')}, body:{en:val('f-body'), zh:val('f-body-zh'), tl:val('f-body-tl')} };
  const saved = await withBusy(async () => { rec.img = await upImg(); return api('api_saveArticle', CODE, rec); });
  if (!saved) return;
  closeSheet(); toast(t('saved')); await reload();
}
async function delArt(){
  const ok = await withBusy(() => api('api_deleteArticle', CODE, ED.id));
  if (ok === null) return;
  closeSheet(); toast(t('deleted')); await reload();
}
async function saveChain(){
  if (!val('f-title')){ document.getElementById('f-err').textContent = t('need'); return; }
  const rec = { id: ED.id || '', title:{en:val('f-title'), zh:val('f-title-zh')}, church:val('f-church')||'all',
    start: val('f-date') || TODAY, days: val('f-days'), from: val('f-from'), to: val('f-to'), step: val('f-step') };
  const id = await withBusy(() => api('api_saveChain', CODE, rec));
  if (!id) return;
  closeSheet(); toast(t('saved')); await reload();
}
async function delChain(){
  const ok = await withBusy(() => api('api_deleteChain', CODE, ED.id));
  if (ok === null) return;
  closeSheet(); toast(t('deleted')); await reload();
}
async function saveSlot(){
  const name = val('f-name'); if (!name){ document.getElementById('f-err').textContent = t('needName'); return; }
  const tok = await withBusy(() => api('api_signupSlot', ED.cid, ED.key, name, store.get('fact-slot-'+ED.cid+ED.key,'')));
  if (!tok) return;
  addToken(tok); store.set('fact-slot-'+ED.cid+ED.key, tok); store.set('fact-myname', name);
  closeSheet(); toast(t('signed')); await reload();
}
async function clearSlot(){
  const tok = store.get('fact-slot-'+ED.cid+ED.key, '');
  const ok = await withBusy(() => api('api_clearSlot', ED.cid, ED.key, tok, CODE));
  if (ok === null) return;
  closeSheet(); toast(t('deleted')); await reload();
}
async function savePrayer(){
  const text = val('f-req'); if (!text){ document.getElementById('f-err').textContent = t('needReq'); return; }
  const r = await withBusy(() => api('api_submitPrayer', { name: val('f-name'), church: S.home, vis: ED.vis, text }));
  if (!r) return;
  addToken(r.token); store.set('fact-pr-'+r.id, r.token);
  closeSheet(); toast(t('sent')); await reload();
}
async function saveUpdate(){
  const text = val('f-upd'); if (!text){ document.getElementById('f-err').textContent = t('needReq'); return; }
  const ok = await withBusy(() => api('api_prayerUpdate', ED.id, text, ED.answered, store.get('fact-pr-'+ED.id,''), CODE));
  if (ok === null) return;
  closeSheet(); toast(t('saved')); await reload();
}
async function hidePrayer(id){
  try{ await api('api_hidePrayer', id, store.get('fact-pr-'+id,''), CODE); toast(t('removed')); await reload(); }
  catch(e){ toast(errMsg(e)); }
}
async function prayFor(id){
  const on = PRAYED.includes(id);
  PRAYED = on ? PRAYED.filter(x=>x!==id) : [...PRAYED, id]; saveJSON('fact-prayed', PRAYED);
  const r = PRAYERS.find(x=>x.id===id); if (r) r.count = Math.max(0, (r.count||0) + (on?-1:1));
  render();
  try{ const c = await api('api_pray', id, on ? -1 : 1); if (r){ r.count = c; render(); } }catch(e){ toast(errMsg(e)); }
}
async function autoTr(btn){
  const texts = { title: val('f-title'), body: val('f-body') };
  if (!texts.title && !texts.body) return;
  const label = btn.innerHTML; btn.disabled = true; btn.textContent = t('translating');
  try{
    const r = await api('api_translate', CODE, texts);
    const fill = (id, v) => { const el = document.getElementById(id); if (el && !el.value.trim() && v) el.value = v; };
    fill('f-title-zh', r.title.zh); fill('f-title-tl', r.title.tl); fill('f-body-zh', r.body.zh); fill('f-body-tl', r.body.tl);
  }catch(e){ toast(errMsg(e)); }
  btn.disabled = false; btn.innerHTML = label;
}
/* translators: only the Chinese / Tagalog boxes can be changed */
function trLock(){
  if (!S.tr) return;
  ['f-title','f-body','f-church','f-date','f-enddate','f-start','f-end','f-deadline','f-until','f-cat','f-author','yn-no','yn-yes']
    .forEach(id => { const el = document.getElementById(id); if (el) el.disabled = true; });
  document.querySelectorAll('.sheet-card .pinrow, .sheet-card .btn.danger').forEach(el => el.style.display = 'none');
  const h = document.querySelector('.sheet-card h3'); if (h) h.insertAdjacentHTML('afterend', `<p class="hint">${t('trOnly')}</p>`);
}
const _openEditor = openEditor; openEditor = function(...a){ _openEditor(...a); trLock(); };
const _openArtEditor = openArtEditor; openArtEditor = function(...a){ _openArtEditor(...a); trLock(); };

/* ---------- Sign in / co-worker management ---------- */
const roleName = r => t({admin:'rAdmin', pastor:'rPastor', staff:'rStaff', translator:'rTranslator'}[r] || 'rStaff');
function openLogin(){
  openSheet(`<h3>${svg('lock')} ${t('loginTitle')}</h3>
    <label>${t('codeLabel')}<input id="f-code" class="codein" maxlength="6" autocomplete="off" autocapitalize="characters"></label>
    <p class="hint">${t('loginHint')}</p>
    <p class="err" id="f-err"></p>
    <div class="sheet-btns"><span style="flex:1"></span><button class="btn" onclick="closeSheet()">${t('cancel')}</button>
      <button class="btn primary" onclick="doLogin()">${t('signIn')}</button></div>`);
  setTimeout(() => { const el = document.getElementById('f-code'); if (el) el.focus(); }, 50);
}
async function doLogin(){
  const code = val('f-code').toUpperCase(); if (!code) return;
  const me = await withBusy(() => api('api_login', code));
  if (!me) return;
  CODE = code; store.set('fact-code', code);
  if (me.church !== 'all' && me.church !== S.home){ S.home = me.church; store.set('fact-home', me.church); LOADED = false; }
  closeSheet(); toast(t('signedIn')); await reload();
}
async function logout(){ CODE = ''; store.set('fact-code', ''); ME = null; S.staff = false; S.tr = false; toast(t('signedOut')); go('more'); await reload(); }

let STAFF = null;
function viewStaff(){
  if (!ME || ME.role !== 'admin') return `<div class="card"><p class="empty">${t('eNO_PERMISSION')}</p></div>`;
  if (STAFF === null){ api('api_listStaff', CODE).then(l => { STAFF = l; render(); }).catch(e => toast(errMsg(e))); return `<div class="loading"><div class="spin"></div></div>`; }
  const chName = c => c === 'all' ? t('allCh') : L(churchOf(c).name);
  return `<div class="h2row"><h2>${t('staffMgr')}</h2><button class="addbtn" onclick="openAddStaff()">${svg('plus')}${t('addStaff')}</button></div>
  <div class="card">${STAFF.map(u => `<div class="staff-row ${u.active?'':'off'}">
      <div class="who"><b>${esc(u.name)}</b><small>${roleName(u.role)} · ${esc(chName(u.church))}</small></div>
      <span class="code">${esc(u.code)}</span>
      ${u.id !== ME.id ? `<button class="btn" onclick="setStaffActive('${u.id}', ${!u.active})">${u.active ? t('disable') : t('enable')}</button>` : ''}
    </div>`).join('')}</div>`;
}
function openAddStaff(){
  openSheet(`<h3>${svg('users')} ${t('addStaff')}</h3>
    <label>${t('staffName')} <em>*</em><input id="f-name"></label>
    <label>${t('fChurch')}<select id="f-church">${CHURCHES.map(c=>`<option value="${c.id}" ${c.id===S.home?'selected':''}>${esc(L(c.name))}</option>`).join('')}</select></label>
    <label>${t('role')}<select id="f-role">
      <option value="staff">${t('rStaff')}</option><option value="translator">${t('rTranslator')}</option>
      <option value="pastor">${t('rPastor')}</option><option value="admin">${t('rAdmin')}</option></select></label>
    <p class="err" id="f-err"></p>
    <div class="sheet-btns"><span style="flex:1"></span><button class="btn" onclick="closeSheet()">${t('cancel')}</button>
      <button class="btn primary" onclick="addStaff()">${t('save')}</button></div>`);
}
async function addStaff(){
  const name = val('f-name'); if (!name){ document.getElementById('f-err').textContent = t('eNEED_NAME'); return; }
  const u = await withBusy(() => api('api_addStaff', CODE, { name, church: val('f-church'), role: val('f-role') }));
  if (!u) return;
  STAFF = null;
  openSheet(`<h3>${svg('check')} ${t('saved')}</h3><p style="margin:6px 0 10px">${esc(t('newCodeMsg').replace('{n}', u.name))}</p>
    <p style="text-align:center;margin:10px 0 18px"><span class="code" style="font-size:28px">${esc(u.code)}</span></p>
    <div class="sheet-btns"><span style="flex:1"></span><button class="btn primary" onclick="closeSheet();render()">OK</button></div>`);
}
async function setStaffActive(id, active){
  try{ await api('api_setStaffActive', CODE, id, active); STAFF = null; render(); }catch(e){ toast(errMsg(e)); }
}

/* ---------- Church chooser ---------- */
function openChooser(){
  const el = document.getElementById('chooser');
  el.innerHTML = `<div class="ch-wrap">
    <img src="${document.querySelector('header img').src}" alt="">
    <h1>FACT Taiwan</h1><p>${t('sub')}</p>
    <div class="lang">${[['en','EN'],['zh','中'],['tl','TL']].map(([k,l]) => `<button class="${S.lang===k?'on':''}" onclick="S.lang='${k}';store.set('fact-lang','${k}');openChooser()">${l}</button>`).join('')}</div>
    <div class="ch-q">${t('chooseCh')}</div>
    ${CHURCHES.map(c => `<button class="ch-btn ${S.home===c.id?'on':''}" onclick="pickChurch('${c.id}')"><i style="background:${c.color}"></i>
      <div><b>${esc(L(c.name))}</b><span>${esc(L(c.addr))}</span></div></button>`).join('')}
    <p style="margin-top:8px">${t('chooseSub')}</p></div>`;
  el.className = 'open';
}
function pickChurch(id){
  const changed = S.home !== id;
  S.home = id; store.set('fact-home', id); document.getElementById('chooser').className = ''; S.tab = 'home';
  if (changed){ const c = loadJSON('fact-cache-' + id, null); if (c) applyData(c); else LOADED = false; }
  render(); window.scrollTo(0,0); reload(); applyDeep();
}

/* ---------- Newcomer contact form ---------- */
function hit(key, once){
  if (CODE) return;
  try{ const k = 'fact-hit-' + (once || key); if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); }catch(e){}
  try{ api('api_hit', key).catch(() => {}); }catch(e){}
}
function openContact(src){
  ED = { how:'fb', src: src || '' };
  openSheet(`<h3>${svg('heart')} ${t('contactH')}</h3>
    <p class="note" style="padding:0 0 8px">${t('contactP')}</p>
    <label>${t('cName')} <em>*</em><input id="f-name" autocomplete="name"></label>
    <p class="q">${t('cHow')}</p>
    <div class="radio row3">${[['fb','cFb'],['line','cLine'],['phone','cPhone']].map(([k,l]) => `<button id="h-${k}" class="${k==='fb'?'on':''}" onclick="setHow('${k}')">${t(l)}</button>`).join('')}</div>
    <label><span id="f-hl">${t('cHandleFb')}</span> <em>*</em><input id="f-handle" autocomplete="off"></label>
    <label>${t('cNote')}<textarea id="f-note" rows="3" placeholder="${esc(t('cNotePh'))}"></textarea></label>
    <input id="f-hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
    <p class="note" style="padding:4px 0 0">${svg('lock')} ${t('cPrivacy')}</p>
    <p class="err" id="f-err"></p><div class="sheet-btns"><span style="flex:1"></span>
      <button class="btn" onclick="closeSheet()">${t('cancel')}</button><button class="btn primary" onclick="saveContact()">${t('cSend')}</button></div>`);
}
function setHow(k){
  ED.how = k;
  ['fb','line','phone'].forEach(x => document.getElementById('h-'+x).className = x===k ? 'on' : '');
  document.getElementById('f-hl').textContent = t({fb:'cHandleFb', line:'cHandleLine', phone:'cHandlePhone'}[k]);
  document.getElementById('f-handle').type = k==='phone' ? 'tel' : 'text';
}
async function saveContact(){
  const name = val('f-name'), handle = val('f-handle'), err = document.getElementById('f-err');
  if (!name){ err.textContent = t('eNEED_NAME'); return; }
  if (!handle){ err.textContent = t('eNEED_CONTACT'); return; }
  const r = await withBusy(() => api('api_submitContact', { name, handle, how: ED.how, note: val('f-note'), hp: val('f-hp'), church: S.home || 'tc', lang: S.lang, src: ED.src }));
  if (r === null) return;
  openSheet(`<h3>${svg('check')} ${t('cThanks')}</h3><div class="sheet-btns"><span style="flex:1"></span><button class="btn primary" onclick="closeSheet()">OK</button></div>`);
}
let CONTACTS = null, STATS = null;
const noPerm = () => `<div class="card"><p class="empty">${t('eNO_PERMISSION')}</p></div>`;
const spinner = () => `<div class="loading"><div class="spin"></div></div>`;
function srcName(s){
  if (!s) return '';
  if (s.indexOf('t:') === 0){ const x = TRACTS.find(y => y.id === s.slice(2)); return x ? (x.t[tLg()] || x.t.en) : s; }
  const k = {new:'srcNew', church:'srcChurch', more:'srcMore'}[s]; return k ? t(k) : s;
}
function contactHow(c){
  const h = esc(c.handle);
  if (c.how === 'phone') return `<a href="tel:${h.replace(/[^\d+]/g,'')}">${svg('phone')}${h}</a>`;
  if (c.how === 'line') return `<span><b class="lineb">LINE</b>${h}</span>`;
  return /^https?:\/\//i.test(c.handle) ? `<a href="${h}" target="_blank" rel="noopener">${svg('fb')}${h}</a>` : `<span>${svg('fb')}${h}</span>`;
}
function viewContacts(){
  if (!ME || ME.role === 'translator') return noPerm();
  if (CONTACTS === null){ api('api_listContacts', CODE).then(l => { CONTACTS = l; render(); }).catch(e => toast(errMsg(e))); return spinner(); }
  const LG = {en:'English', zh:'中文', tl:'Tagalog'};
  const card = c => `<div class="card ct ${c.done?'done':''}">
    <div class="who"><b>${esc(c.name)}</b><span class="badge ${c.done?'ok':'todo'}">${c.done ? t('cDone') : t('cPending')}</span><span>${shortDate(c.date)}</span></div>
    <div class="how">${contactHow(c)}</div>
    ${c.note ? `<p>${esc(c.note)}</p>` : ''}
    <small>${[ME.role==='admin' ? esc(L(churchOf(c.church).name)) : '', c.src ? t('cFrom') + ' ' + esc(srcName(c.src)) : '', LG[c.lang] || '', c.done && c.doneBy ? esc(t('cBy').replace('{n}', c.doneBy)) : ''].filter(Boolean).join(' · ')}</small>
    <div class="btns"><button class="btn ${c.done?'':'primary'}" onclick="setContactDone('${c.id}', ${!c.done})">${c.done ? t('cUndo') : svg('check') + t('cMarkDone')}</button>
      <span style="flex:1"></span><button class="btn danger" onclick="delContact('${c.id}')">${t('del')}</button></div></div>`;
  return `<h2>${t('contacts')}</h2>${CONTACTS.length ? CONTACTS.map(card).join('') : `<div class="card"><p class="empty">${t('cNone')}</p></div>`}`;
}
async function setContactDone(id, done){
  try{ await api('api_setContactDone', CODE, id, done); CONTACTS = null; render(); }catch(e){ toast(errMsg(e)); }
}
async function delContact(id){
  if (!confirm(t('cDelConfirm'))) return;
  try{ await api('api_deleteContact', CODE, id); CONTACTS = null; render(); }catch(e){ toast(errMsg(e)); }
}
function viewStats(){
  if (!ME || ME.role === 'translator') return noPerm();
  if (STATS === null){ api('api_stats', CODE).then(d => { STATS = d; render(); }).catch(e => toast(errMsg(e))); return spinner(); }
  const g = k => STATS[k] || {d7:0, d30:0, all:0};
  const sum = ks => ks.reduce((o,k) => { const x = g(k); o.d7 += x.d7; o.d30 += x.d30; o.all += x.all; return o; }, {d7:0, d30:0, all:0});
  const row = (label, o, sub) => `<tr class="${sub?'sub':''}"><td>${label}</td><td>${o.d7}</td><td>${o.d30}</td><td>${o.all}</td></tr>`;
  const head = `<tr><th></th><th>${t('st7')}</th><th>${t('st30')}</th><th>${t('stAll')}</th></tr>`;
  const lg = tLg(), LG = {zh:'中文', en:'English', tl:'Tagalog'};
  const tracts = TRACTS.map(x => row(`<b>${esc(x.t[lg] || x.t.en)}</b>`, sum(['zh','en','tl','both'].map(l => 't:'+x.id+':'+l)))
    + ['zh','en','tl'].map(l => row('&emsp;' + LG[l], g('t:'+x.id+':'+l), true)).join('')).join('');
  return `<h2>${t('stats')}</h2>
    <div class="card"><table class="stt">${head}${row(t('stVisit'), g('visit'))}${row(t('stShare'), g('in:share'))}${row(t('stNew'), g('p:new'))}${row(t('stBeliefs'), g('p:beliefs'))}${row(t('stContact'), g('contact'))}</table></div>
    <h2>${t('stTracts')}</h2><div class="card"><table class="stt">${head}${tracts}</table></div>
    <p class="note">${t('stNote')}</p>`;
}

/* ---------- Render ---------- */
const TABS = [['home','home'],['cal','cal'],['pray','prayer'],['read','book'],['more','more']];
const NAVKEY = {media:'more', churches:'more', staffmgr:'more', contacts:'more', stats:'more', beliefs:'read', new:'home'};
function render(){
  document.getElementById('subtitle').innerHTML = S.home ? `<button class="chsw" onclick="openChooser()">\u{1F4CD} ${esc(L(myChurch().name))} ▾</button>` : t('sub');
  document.getElementById('lang').innerHTML = [['en','EN'],['zh','中'],['tl','TL']]
    .map(([k,l]) => `<button class="${S.lang===k?'on':''}" onclick="setLang('${k}')">${l}</button>`).join('');
  document.getElementById('nav').innerHTML = TABS
    .map(([k,ic]) => `<button class="${(NAVKEY[S.tab]||S.tab)===k?'on':''}" onclick="go('${k}')">${svg(ic)}${t(k)}</button>`).join('');
  const views = {home:viewHome, cal:viewCal, media:viewMedia, churches:viewChurches, more:viewMore, pray:viewPray, read:viewRead, staffmgr:viewStaff, contacts:viewContacts, stats:viewStats, beliefs:viewBeliefs, new:viewNew};
  document.getElementById('main').innerHTML = (ME ? `<div class="staffbar">${svg('pen')}${t('signedIn')}：${esc(ME.name)} · ${roleName(ME.role)}${ME.church!=='all'?' · '+esc(L(churchOf(ME.church).name)):''}</div>` : '') +
    (NAVKEY[S.tab] && LOADED ? `<button class="backbtn" onclick="goBack()">‹ ${t('back')}</button>` : '') +
    (!LOADED ? (LOAD_ERR ? `<div class="loading"><p>${t('netErr')}</p><button class="btn primary" onclick="LOAD_ERR=false;render();reload()">${t('retry')}</button></div>`
                         : `<div class="loading"><div class="spin"></div>${t('loadingTxt')}</div>`) : views[S.tab]());
}
document.documentElement.lang = S.lang==='zh'?'zh-Hant':S.lang;
if (!churchOf(S.home)) S.home = '';
if (S.home){ const c = loadJSON('fact-cache-' + S.home, null); if (c) applyData(c); }
render();
let DEEP = null;
function applyDeep(){
  if (!DEEP) return; const p = DEEP; DEEP = null;
  if (p.t || p.p) hit('in:share');
  if (p.l && T[p.l]) setLang(p.l);
  if (p.p === 'new') go('new');
  if (p.t && TRACTS.find(x => x.id===p.t)){ S.tab='read'; S.cat='G'; render(); openTract(p.t, p.l==='zh'||p.l==='tl'||p.l==='en'||p.l==='both' ? p.l : undefined); }
}
(function(){
  const q = new URLSearchParams(location.search), p = {};
  q.forEach((v,k) => p[k] = v);
  if (!p.t && !p.p && !p.c) return;
  DEEP = p;
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  if (p.c && churchOf(p.c) && !S.home){ setTimeout(() => pickChurch(p.c), 0); }
  else if (S.home) setTimeout(applyDeep, 0);
})();
hit('visit');
if (!S.home) openChooser(); else reload();
if ('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
