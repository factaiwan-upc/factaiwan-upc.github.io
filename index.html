<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FACT Taiwan</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="FACT Taiwan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="First Apostolic Church Taiwan – UPC · Taichung · Tainan · Zhongli">
<meta property="og:title" content="FACT Taiwan">
<meta property="og:description" content="First Apostolic Church Taiwan – UPC">
<meta property="og:image" content="https://factaiwan-upc.github.io/icons/og.png">
<style>
:root{
  --navy:#0E2340; --navy2:#16325A; --orange:#F28C28; --orange-soft:#FDF0E2;
  --wine:#7A1414; --wine-soft:#F8E8E8; --ink:#1C2430; --muted:#5E6878;
  --line:#E3E6EB; --bg:#F5F6F8; --card:#FFFFFF;
  --tc:#2F6FB5; --tn:#C2571A; --zl:#2E8B57;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header img{width:38px;height:38px;border-radius:10px}
header .title{flex:1;font-weight:700;font-size:18px;letter-spacing:.2px}
header .title small{display:block;font-weight:400;font-size:12.5px;opacity:.75;letter-spacing:0}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:20px;padding:3px}
.lang button{padding:4px 10px;border-radius:16px;font-size:14px;color:#fff;opacity:.8}
.lang button.on{background:var(--orange);opacity:1;font-weight:700}
main{padding:14px 14px calc(78px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;font-size:12.5px;color:var(--muted)}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--navy);font-weight:700}
nav button.on svg{stroke:var(--orange)}
h2{font-size:19px;margin:18px 2px 8px;color:var(--navy)}
h2:first-child{margin-top:4px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(14,35,64,.06)}
.live{display:flex;align-items:center;gap:10px;background:var(--wine);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:12px;font-weight:700}
.live .dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.live span{flex:1}
.pin{border-left:5px solid var(--orange)}
.pin .tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--orange);margin-bottom:2px}
.pin h3{font-size:17.5px;margin-bottom:2px}
.pin p{color:var(--muted);font-size:16px}
.demo{font-size:12px;background:#EEF0F4;color:var(--muted);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:400;vertical-align:2px}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .date{width:52px;text-align:center;flex:none}
.ev .date b{display:block;font-size:22px;line-height:1.1;color:var(--navy)}
.ev .date i{font-style:normal;font-size:13px;color:var(--muted)}
.ev .info{flex:1;min-width:0}
.ev .info b{display:block;font-size:17px}
.ev .info span{font-size:15px;color:var(--muted)}
.ev .info .chip{color:#fff;font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;border-radius:12px;padding:1px 9px;color:#fff}
.icon-btn{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--navy)}
.icon-btn svg{width:20px;height:20px}
.verse{background:var(--navy);color:#fff}
.verse p{font-size:18px;line-height:1.65}
.verse cite{display:block;margin-top:6px;font-style:normal;color:var(--orange);font-weight:700;font-size:15px}
.note{font-size:14.5px;color:var(--muted);padding:2px 4px 10px}
.tract h4{font-size:17px;color:var(--wine);margin:18px 0 6px}
.tract p{font-size:17.5px;line-height:1.8;margin:0 0 12px}
.tract p.en{color:var(--muted);font-size:15.5px;margin-top:-6px}
.tract .seg{margin:10px 0 6px}
.pimg{display:block;width:calc(100% + 32px);margin:-14px -16px 12px;aspect-ratio:16/9;object-fit:cover;border-radius:16px 16px 0 0;background:#E9EDF3}
.dimg{display:block;width:100%;border-radius:14px;margin:2px 0 12px;background:#E9EDF3}
.imgpick{display:flex;flex-direction:column;gap:8px;margin:2px 0 12px}
.imgpick img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;background:#E9EDF3}
.imgpick .row{display:flex;gap:8px;flex-wrap:wrap}
.imgpick label.btn{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.imgpick input[type=file]{display:none}
.backbtn{border:0;background:none;color:var(--navy);font-weight:700;font-size:16px;padding:6px 2px 10px;font-family:inherit;cursor:pointer}
.bnr.warm{background:linear-gradient(135deg,#C2571A,#E08A3C)}
.path{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(14,35,64,.08);overflow:hidden;margin-bottom:12px}
.path button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid #EEF1F5;background:#fff;padding:14px 16px;font-family:inherit;text-align:left;cursor:pointer}
.path button:last-child{border-bottom:0}
.path i{flex:none;width:32px;height:32px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font-style:normal;font-weight:700}
.path button.done i{background:#2E8B57;color:#fff}
.path b{display:block;font-size:16.5px;color:var(--navy)}.path span{font-size:14px;color:var(--muted)}
.qrbox{text-align:center;padding:6px 0 4px}.qrbox img{width:220px;height:220px;border-radius:12px;border:1px solid #E3E7EE;padding:8px;background:#fff}
.qrbox small{display:block;color:var(--muted);margin-top:6px;font-size:13.5px}
.sharebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sharebtns a,.sharebtns button{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:12px;font-weight:700;font-size:15.5px;text-decoration:none;border:1.5px solid #D9DEE6;background:#fff;color:var(--navy);font-family:inherit;cursor:pointer}
.sharebtns svg{width:20px;height:20px;flex:none}
.sharebtns .line{background:#06C755;border-color:#06C755;color:#fff}
.welcome{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(14,35,64,.08);margin-bottom:12px}
.welcome h3{margin:0 0 6px;font-size:21px;color:var(--navy)}.welcome p{margin:0;font-size:16.5px;line-height:1.75}
.tcover{position:relative;height:150px;border-radius:14px;overflow:hidden;color:#fff;margin-bottom:10px}
.tcover.big{height:210px}
.tmark{position:absolute;right:-18px;top:-14px;width:190px;height:190px;opacity:.2}
.tshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55))}
.ttl{position:absolute;left:16px;right:16px;bottom:13px}
.ttl small{display:block;font-size:12.5px;letter-spacing:.06em;opacity:.9}
.ttl b{display:block;font-size:21px;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.tcover.big .ttl b{font-size:25px}
.card.tcard{padding:0;overflow:hidden}
.tcard .tcover{border-radius:0;margin:0}
.tcard .tx{padding:12px 16px 14px}
.tract .tpic{width:100%;border-radius:12px;margin:10px 0 6px;display:block}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.mgrid .dow{font-size:12.5px;color:var(--muted);text-align:center;padding:2px 0 4px}
.mgrid button{border:1px solid #E3E7EE;background:#fff;border-radius:9px;min-height:62px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;cursor:pointer}
.mgrid button b{font-size:14px;color:var(--navy)}
.mgrid button span{font-size:11px;line-height:1.2;letter-spacing:-.2px;color:var(--ink,#1c2533);overflow-wrap:anywhere;text-align:center}
.mgrid button.taken{background:#EEF3FA;border-color:#C9D6E8}
.mgrid button.me{background:var(--orange-soft);border-color:var(--orange)}
.mgrid button.today b{background:var(--orange);color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;display:inline-block}
.mgrid button.past{opacity:.55}
.mgrid .blank{min-height:62px}
.belief{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(14,35,64,.08);margin-bottom:10px;padding:0 16px}
.belief summary{font-weight:700;font-size:17.5px;color:var(--navy);padding:15px 0;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.belief summary::-webkit-details-marker{display:none}
.belief summary i{width:30px;height:30px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font-style:normal;font-size:15px;flex:none}
.belief summary::after{content:'›';margin-left:auto;color:var(--muted);font-size:22px;transition:transform .2s}
.belief[open] summary::after{transform:rotate(90deg)}
.belief p{font-size:16.5px;line-height:1.75;margin:0 0 8px}
.belief small{display:block;color:var(--muted);font-size:14.5px;padding-bottom:16px}
.bnr{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--navy),#22406b);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
.bnr svg{width:30px;height:30px;flex:none}
.bnr b{display:block;font-size:18px}.bnr span{font-size:14.5px;opacity:.85}
.vid{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(14,35,64,.08);margin-bottom:12px}
.vid iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.vid div{padding:12px 16px 14px}.vid b{display:block;font-size:17px;color:var(--navy)}.vid span{font-size:15px;color:var(--muted)}
.fbwrap{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(14,35,64,.08);margin-bottom:10px;display:flex;justify-content:center}
.fbwrap iframe{border:0;display:block;max-width:100%}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.pills button{border:1.5px solid var(--line,#d9dee6);background:#fff;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;color:var(--navy);font-family:inherit}
.pills button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.fbbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:#1877F2;color:#fff;border-radius:12px;padding:12px;font-weight:700;font-size:16px;text-decoration:none;margin:4px 0 12px}
.fbbtn svg{width:20px;height:20px}
.fbtag{display:inline-flex;align-items:center;gap:3px;color:#1877F2;font-size:13px;font-weight:700;margin-left:6px}
.fbtag svg{width:14px;height:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{padding:5px 13px;border-radius:16px;background:#fff;border:1.5px solid var(--line);font-size:15px}
.filters button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.seg{display:flex;background:#E8EBF0;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:6px;border-radius:8px;font-size:15px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mhead b{font-size:18px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid .dow{font-size:13px;color:var(--muted);padding:4px 0}
.grid .d{padding:6px 0 8px;border-radius:10px;font-size:16px;min-height:46px}
.grid .d.out{color:#B9BFC9}
.grid .d.today b{background:var(--orange);color:#fff;border-radius:50%;display:inline-block;width:28px;height:28px;line-height:28px}
.grid .d.sel{background:var(--orange-soft)}
.grid .dots{display:flex;justify-content:center;gap:3px;height:6px;margin-top:2px}
.grid .dots i{width:6px;height:6px;border-radius:50%}
.church h3{font-size:19px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.church h3 .bar{width:6px;height:22px;border-radius:3px}
.church .row{display:flex;gap:8px;font-size:16px;margin:3px 0}
.church .row .k{color:var(--muted);flex:none;width:76px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;background:var(--bg);font-size:15.5px;font-weight:600;color:var(--navy)}
.btn.primary{background:var(--orange);color:#fff}
.btn svg{width:18px;height:18px}
.media{display:flex;gap:12px;align-items:center}
.media .thumb{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.media .thumb svg{width:26px;height:26px}
.media b{display:block;font-size:17px}
.media span{font-size:15px;color:var(--muted)}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;border-bottom:1px solid var(--line);font-size:17px;text-align:left}
.menu a:last-child,.menu button:last-child{border-bottom:0}
.menu svg{width:22px;height:22px;color:var(--navy);flex:none}
.menu .sub{margin-left:auto;font-size:13.5px;color:var(--muted)}
.toggle{width:46px;height:28px;border-radius:14px;background:#C9CFD8;position:relative;flex:none;margin-left:auto;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--orange)}
.toggle.on::after{left:21px}
.empty{color:var(--muted);font-size:15.5px;padding:8px 0}
.hero{text-align:center;padding:18px 10px 8px}
#toast{width:max-content;max-width:88vw;text-align:center;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:20px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.h2row h2{margin-bottom:8px}
.addbtn{display:inline-flex;align-items:center;gap:4px;background:var(--orange);color:#fff;font-weight:700;font-size:15px;padding:6px 12px;border-radius:18px;margin-top:10px}
.addbtn svg{width:18px;height:18px}
.icon-btn.edit{background:var(--orange-soft);color:var(--orange)}
.staffbar{display:flex;align-items:center;gap:8px;background:var(--orange-soft);color:#8A4A0C;border-radius:12px;padding:8px 12px;font-size:14.5px;margin-bottom:6px}
.staffbar svg{width:18px;height:18px;flex:none}
#sheet{display:none}
#sheet.open{display:block}
.sheet-bg{position:fixed;inset:0;background:rgba(14,35,64,.45);z-index:30}
.sheet-card{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;
  padding:16px 18px calc(18px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.sheet-card h3{display:flex;align-items:center;gap:8px;font-size:19px;color:var(--navy);margin-bottom:10px}
.sheet-card h3 svg{width:22px;height:22px;color:var(--orange)}
.sheet-card label{display:block;font-size:15px;color:var(--muted);margin-bottom:10px}
.sheet-card label em{color:var(--wine);font-style:normal}
.sheet-card input,.sheet-card textarea,.sheet-card select{display:block;width:100%;margin-top:4px;font:inherit;font-size:17px;color:var(--ink);
  border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.sheet-card input:focus,.sheet-card textarea:focus,.sheet-card select:focus{outline:none;border-color:var(--orange)}
.sheet-card .two{display:flex;gap:10px}.sheet-card .two label{flex:1}
.sheet-card details{margin:2px 0 8px;border-top:1px solid var(--line);padding-top:8px}
.sheet-card summary{font-size:15.5px;color:var(--navy);font-weight:600;margin-bottom:8px;cursor:pointer}
.sheet-btns{display:flex;gap:8px;align-items:center;margin-top:6px}
.btn.danger{background:var(--wine-soft);color:var(--wine)}
.err{color:var(--wine);font-size:14.5px;min-height:1em}
.hero img{width:84px;height:84px;border-radius:20px;box-shadow:0 4px 14px rgba(14,35,64,.25)}
.hero h1{font-size:20px;color:var(--navy);margin-top:10px}
.hero p{color:var(--muted);font-size:15px}
.post{cursor:pointer}
.post h3{font-size:17.5px;margin-bottom:2px}
.post p{color:var(--muted);font-size:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:15px;color:var(--ink);margin:3px 0}
.meta svg{width:16px;height:16px;color:var(--orange);vertical-align:-3px;margin-right:3px}
.deadline{color:var(--wine);font-weight:600}
.ev.dl .info b{color:var(--wine);font-weight:600}
.linkrow{display:flex;align-items:center;gap:8px;font-size:15.5px;color:var(--navy);font-weight:600;padding:4px 4px 12px}
.linkrow svg{width:18px;height:18px}
.yesno{display:flex;gap:8px;margin:4px 0 12px}
.yesno button{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--line);font-size:16px;background:#fff}
.yesno button.on{border-color:var(--orange);background:var(--orange-soft);color:#8A4A0C;font-weight:700}
.q{font-size:15.5px;color:var(--navy);font-weight:600;margin:4px 0 2px}
.pinrow{display:flex;align-items:center;gap:10px;font-size:16px;margin:4px 0 10px;cursor:pointer}
.detail h2{margin:4px 0 6px;font-size:21px}
.detail .body{font-size:17px;white-space:pre-wrap;margin:10px 0}
.ev .info{cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 6px}
.tile{background:#fff;border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13.5px;font-weight:600;color:var(--navy);box-shadow:0 1px 2px rgba(14,35,64,.06)}
.tile i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.tile i svg{width:22px;height:22px}
.pr .who{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--muted);margin-bottom:4px}
.pr .who b{color:var(--ink);font-size:15.5px}
.pr .text{font-size:16.5px;white-space:pre-wrap}
.pr .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pbtn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:18px;background:var(--bg);font-size:14.5px;font-weight:600;color:var(--navy)}
.pbtn.on{background:var(--orange-soft);color:#8A4A0C}
.pbtn svg{width:17px;height:17px}
.upd{border-left:3px solid var(--line);margin-top:10px;padding:2px 0 2px 10px;font-size:15.5px}
.upd.ans{border-color:var(--zl)}
.upd small{display:block;color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:12.5px;font-weight:700;border-radius:8px;padding:1px 7px}
.badge.ans{background:#E3F3EA;color:#1E6B42}
.badge.todo{background:var(--orange-soft);color:#A4501A}.badge.ok{background:#E3F3EA;color:#1E6B42}
.cta{display:flex;width:100%;justify-content:center;padding:13px;font-size:17px;margin:4px 0 14px}.cta svg{width:20px;height:20px}
.tcta{background:var(--orange-soft);border-radius:14px;padding:16px;margin:20px 0 4px;text-align:center}
.tcta b{display:block;margin-bottom:10px;font-size:16.5px;color:var(--navy)}.tcta svg{width:18px;height:18px}
.note svg{width:15px;height:15px;vertical-align:-2px}
.radio.row3{flex-direction:row}.radio.row3 button{flex:1;justify-content:center;text-align:center}
.ct .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ct .who b{font-size:17px}.ct .who>span:last-child{margin-left:auto;color:var(--muted);font-size:14px}
.ct .how{margin:8px 0;font-size:16.5px}.ct .how a,.ct .how span{display:inline-flex;align-items:center;gap:6px;color:var(--navy);font-weight:600;word-break:break-all}
.ct .how svg{width:18px;height:18px;flex:none}.ct p{margin:4px 0 8px;font-size:16px;line-height:1.6}
.lineb{background:#06C755;color:#fff;border-radius:6px;padding:1px 6px;font-size:13px}
.ct small{color:var(--muted);display:block;margin-bottom:10px;font-size:14px}.ct .btns{display:flex;gap:8px;align-items:center}.ct.done{opacity:.72}
.stt{width:100%;border-collapse:collapse;font-size:16px}.stt th{white-space:nowrap;font-size:13.5px;color:var(--muted);font-weight:600;text-align:right;padding:4px 6px}
.stt td{padding:9px 6px;border-top:1px solid #EEF1F5;text-align:right}.stt td:first-child{text-align:left}
.stt tr.sub td{font-size:14.5px;color:var(--muted);padding:4px 6px;border-top:0}
.badge.priv{background:var(--wine-soft);color:var(--wine)}
.radio{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px}
.radio button{display:flex;align-items:center;gap:8px;text-align:left;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:15.5px;background:#fff}
.radio button.on{border-color:var(--orange);background:var(--orange-soft)}
.chain h3{font-size:18px;color:var(--navy)}
.chain .day{font-weight:700;font-size:15.5px;margin:12px 0 6px;color:var(--navy)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{border:1.5px dashed #C9CFD8;border-radius:10px;padding:6px 6px;text-align:center;font-size:14px;color:var(--muted);background:#fff}
.slot b{display:block;font-size:15px;color:var(--ink)}
.slot.taken{border-style:solid;border-color:transparent;background:#EAF1FA}
.slot.taken span{color:var(--navy);font-weight:600}
.slot.me{background:var(--orange-soft)}
.progress{height:8px;border-radius:4px;background:#E8EBF0;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--orange)}
.art .cat{font-size:13px;font-weight:700;color:var(--orange)}
.art h3{font-size:17.5px;margin:2px 0}
.art p{color:var(--muted);font-size:15.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art small{color:var(--muted);font-size:13.5px}
.reader .body{font-size:17.5px;line-height:1.75;white-space:pre-wrap;margin-top:10px}
.chsw{display:inline-flex;align-items:center;gap:3px;margin-top:2px;padding:1px 9px 1px 7px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:13.5px;font-weight:600}
#chooser{display:none;position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#0E2340 0%,#16325A 100%);color:#fff;overflow:auto}
#chooser.open{display:block}
.ch-wrap{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 22px 30px;text-align:center}
.ch-wrap img{width:96px;height:96px;border-radius:24px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.ch-wrap h1{font-size:22px;margin:14px 0 2px}
.ch-wrap p{opacity:.8;font-size:15px}
.ch-wrap .lang{display:inline-flex;margin:16px 0 22px}
.ch-q{font-size:18px;font-weight:700;margin-bottom:12px}
.ch-btn{display:flex;align-items:center;gap:14px;width:100%;background:#fff;color:var(--ink);border-radius:16px;padding:14px 16px;margin-bottom:10px;text-align:left}
.ch-btn i{width:14px;height:44px;border-radius:7px;flex:none}
.ch-btn b{display:block;font-size:20px}
.ch-btn span{font-size:14px;color:var(--muted)}
.ch-btn.on{outline:3px solid var(--orange)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 0;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{opacity:.6;pointer-events:none}
.staff-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.staff-row:last-child{border-bottom:0}
.staff-row .who{flex:1;min-width:0}
.staff-row b{display:block;font-size:16.5px}
.staff-row small{color:var(--muted);font-size:14px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:2px;background:var(--orange-soft);color:#8A4A0C;border-radius:8px;padding:3px 8px;font-size:16px}
.staff-row.off{opacity:.5}
.trbtn{margin:0 0 10px}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 10px}
.codein{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:4px;text-transform:uppercase;font-size:22px !important;text-align:center}
</style>

const TRACTS = [{"id":"god","t":{"en":"The Truth About God","zh":"關於神的真理","tl":"Ang Katotohanan Tungkol sa Diyos"},"p":[[1,"INTRODUCTION","引言","PANIMULA"],[0,"About 2,000 years ago a baby was born to a woman named Mary. This baby was named Jesus. Jesus was no ordinary baby. Mary was a virgin and she gave birth to Jesus by the Holy Spirit. His birth was a miracle. Mary did not choose a name for her baby. His name came from heaven. An angel told Joseph, who was to become Mary's husband, \"You will give Him the name Jesus because He will save His people from the punishment of their sins\" (Matthew 1:21 NLT). Jesus was also called by the name Immanuel which means \"God with us\" (Matthew 1:23). Jesus was God, come to earth as a man to save men from the punishment of sin.","大約兩千年前，一位名叫馬利亞的女子生下一個嬰孩。這個嬰孩名叫耶穌。耶穌不是普通的嬰孩。馬利亞是個處女，藉由聖靈（神的靈）懷孕生下了耶穌。祂的降生是一個神蹟。馬利亞沒有自己替孩子取名，這名字是從天上來的。一位天使告訴馬利亞未來的丈夫約瑟：「你要給祂取名叫耶穌，因為祂要把自己的子民從罪的懲罰中拯救出來。」（馬太福音1:21，意譯） 耶穌也被稱為「以馬內利」，意思就是「神與我們同在」（馬太福音1:23，意譯）。耶穌就是神，以人的身分來到世上，要救人脫離罪的懲罰。","Mga 2,000 taon na ang nakalipas, isang sanggol ang isinilang ng isang babaeng nagngangalang Maria. Ang sanggol na ito ay pinangalanang Jesus. Hindi pangkaraniwang sanggol si Jesus. Si Maria ay isang birhen, at ipinanganak niya si Jesus sa pamamagitan ng Espiritu Santo. Ang Kanyang kapanganakan ay isang himala. Hindi si Maria ang pumili ng pangalan ng kanyang sanggol. Ang Kanyang pangalan ay nagmula sa langit. Sinabi ng isang anghel kay Jose, na magiging asawa ni Maria, \"Pangangalanan mo Siyang Jesus, sapagkat ililigtas Niya ang Kanyang bayan mula sa parusa ng kanilang mga kasalanan\" (Mateo 1:21). Tinawag din si Jesus na Emmanuel, na ang ibig sabihin ay \"Ang Diyos ay kasama natin\" (Mateo 1:23). Si Jesus ay ang Diyos na dumating sa lupa bilang tao upang iligtas ang mga tao mula sa parusa ng kasalanan."],[1,"HOW DO YOU KNOW THAT JESUS IS GOD?","你怎麼知道耶穌是神？","PAANO MO MALALAMAN NA SI JESUS AY DIYOS?"],[0,"One day everyone will have to admit that Jesus is Lord. \"And everyone will say with his tongue that Jesus Christ is Lord\" (Philippians 2:11 NLT). To claim Him as Lord of your life now is wise. If He is your Lord, He will also be your Savior. If you wait until you are forced to call Him Lord, it will be too late. You will be punished for your sins.","有一天，每個人都必須承認耶穌是主。「萬口都要宣告耶穌基督是主。」（腓立比書2:11，意譯） 現在就承認祂是你生命的主，是很有智慧的。如果祂是你的主，祂也會是你的救主（拯救我們的那一位）。如果你等到被迫稱祂為主，那就太遲了，你會為自己的罪遭受懲罰。","Darating ang araw na aaminin ng lahat na si Jesus ay Panginoon. \"At ipahahayag ng bawat dila na si Jesu-Cristo ay Panginoon\" (Filipos 2:11). Matalino ang kilalanin Siya ngayon bilang Panginoon ng iyong buhay. Kung Siya ang iyong Panginoon, Siya rin ang magiging Tagapagligtas mo. Kung maghihintay ka hanggang mapilitan kang tawagin Siyang Panginoon, huli na ang lahat. Mapaparusahan ka dahil sa iyong mga kasalanan."],[0,"Jesus has given us proof that He is the Lord God. He has proven it in many ways. These proofs are found in God's record of truth, the Bible. The first proof is Jesus' miraculous birth. The baby, called Jesus, was God come to earth as, a man (I Timothy 3:16).","耶穌已經向我們顯明祂就是主神，祂用許多方式證明了這一點。這些證據都記載在神記錄真理的書——聖經裡。第一個證據就是耶穌神蹟般的降生。這位名叫耶穌的嬰孩，就是以人的身分降臨世上的神（提摩太前書3:16）。","Nagbigay si Jesus ng patunay na Siya ang Panginoong Diyos. Pinatunayan Niya ito sa maraming paraan. Ang mga patunay na ito ay nasa talaan ng katotohanan ng Diyos, ang Biblia. Ang unang patunay ay ang mahimalang kapanganakan ni Jesus. Ang sanggol na tinawag na Jesus ay ang Diyos na dumating sa lupa bilang tao (I Timoteo 3:16)."],[0,"Jesus' ministry and its effects on men adds proof to the claim that Jesus is God. Napoleon Bonaparte, a famous French conqueror, recognized Jesus was more than a man. He said, \"I tell you, I know men. Jesus was more than a man. Charlemagne, Alexander, and I have founded empires, but on what have we founded them? On force! Jesus has founded an empire greater in territorial extent, and vaster in significance, on love. I have inspired men so that they would die for me, but fancy a man dying for me nearly twenty centuries after I am dead, and yet that's what men are doing, the world over, for this man, Jesus of Nazareth.\"","耶穌在世上所做的事以及祂對人的影響，更加證明了耶穌是神。法國著名的征服者拿破崙就承認耶穌不只是一個人。他說：「我告訴你，我很了解人。耶穌不只是一個人。查理曼、亞歷山大和我建立了帝國，但我們靠的是什麼？是武力！耶穌卻是用愛建立了一個疆界更遼闊、意義更深遠的國度。我曾鼓舞人們為我犧牲生命，但想想看，會有人在我死後近兩千年還願意為我捨命嗎？然而全世界的人現在卻都在為這位拿撒勒人耶穌這樣做。」","Ang ministeryo ni Jesus at ang epekto nito sa mga tao ay dagdag na patunay na si Jesus ay Diyos. Si Napoleon Bonaparte, isang tanyag na mananakop na Pranses, ay kumilala na si Jesus ay higit pa sa isang tao. Sinabi niya, \"Sinasabi ko sa inyo, kilala ko ang mga tao. Si Jesus ay higit pa sa isang tao. Kami nina Charlemagne at Alexander ay nagtatag ng mga imperyo, ngunit sa ano namin itinayo ang mga ito? Sa lakas! Si Jesus ay nagtatag ng isang imperyong mas malawak at mas makahulugan, sa pamamagitan ng pag-ibig. Napukaw ko ang mga tao na mamatay para sa akin, ngunit isipin mo ang isang taong mamamatay para sa akin halos dalawampung siglo matapos akong mamatay. Iyan mismo ang ginagawa ng mga tao sa buong mundo para sa taong ito, si Jesus na taga-Nazaret.\""],[0,"Jesus' ministry was one of compassion and love for lost men. Jesus, speaking of Himself, said, \"For the Son of Man came to look for and to save from the punishment of sin those who are lost\" (Luke 19:10 NLT). Jesus' ministry to the lost included many miracles. He caused the lame to walk, opened the ears of the deaf, made the blind to see, and brought the dead back to life. Being God, Jesus could do anything.","耶穌在世上所做的事，充滿了對迷失的人的憐憫與愛。耶穌提到自己時說：「因為人子來，是要尋找並拯救迷失的人，使他們免受罪的懲罰。」（路加福音19:10，意譯） 耶穌為迷失之人所做的事包含許多神蹟。祂使瘸腿的能行走、聾子的耳朵能聽見、瞎眼的能看見，還使死人復活。因為耶穌是神，祂無所不能。","Ang ministeryo ni Jesus ay puno ng habag at pag-ibig sa mga taong naliligaw. Sinabi ni Jesus tungkol sa Kanyang sarili, \"Sapagkat ang Anak ng Tao ay naparito upang hanapin at iligtas sa parusa ng kasalanan ang mga naliligaw\" (Lucas 19:10). Kasama sa Kanyang ministeryo ang maraming himala. Pinalakad Niya ang mga pilay, binuksan ang tainga ng mga bingi, pinakita ang mga bulag, at binuhay ang mga patay. Dahil Siya ay Diyos, kayang gawin ni Jesus ang lahat."],[0,"Some men began to understand that Jesus was God. Jesus asked His followers, \"Who do you say that I am?\" (Matthew 16:15 NLT). Peter answered that He was the promised Savior, the Son of God. Jesus was happy that they understood who He was. Jesus told Peter that no man had taught him this. \"My Father in heaven has shown you this\" (Matthew 16:17 NLT).","有些人開始明白耶穌是神。耶穌問祂的門徒：「你們說我是誰？」（馬太福音16:15，意譯） 彼得回答說，祂就是應許的救主、神的兒子。耶穌很高興他們認出祂是誰。耶穌告訴彼得，這不是任何人教他的：「這是我在天上的父指示你的。」（馬太福音16:17，意譯）","Unti-unting naunawaan ng ilan na si Jesus ay Diyos. Tinanong ni Jesus ang Kanyang mga tagasunod, \"Ano naman ang sabi ninyo kung sino Ako?\" (Mateo 16:15). Sumagot si Pedro na Siya ang ipinangakong Tagapagligtas, ang Anak ng Diyos. Natuwa si Jesus na naunawaan nila kung sino Siya. Sinabi Niya kay Pedro na walang taong nagturo nito sa kanya: \"Ang Aking Ama na nasa langit ang nagpakita nito sa iyo\" (Mateo 16:17)."],[0,"If you want to know who Jesus is, you need to ask God's Spirit to help you to understand. The Spirit will show you that Jesus was God come to earth as a man. He will show you through His Holy Writings and by speaking to your heart. The Holy Spirit which is the Spirit of Jesus will begin to minister to you, showing you the truth about Jesus.","如果你想知道耶穌是誰，你需要祈求神的靈幫助你明白。聖靈會讓你看見耶穌就是以人的身分來到世上的神。祂會透過聖經，並直接對你的心說話來引導你。聖靈也就是耶穌的靈，會開始幫助你，讓你明白關於耶穌的真理。","Kung nais mong malaman kung sino si Jesus, kailangan mong hilingin sa Espiritu ng Diyos na tulungan kang umunawa. Ipapakita sa iyo ng Espiritu na si Jesus ay ang Diyos na dumating sa lupa bilang tao. Ipapakita Niya ito sa pamamagitan ng Kanyang Banal na Kasulatan at sa pagsasalita sa iyong puso. Ang Espiritu Santo, na siyang Espiritu ni Jesus, ay magsisimulang kumilos sa iyong buhay at ipapakita sa iyo ang katotohanan tungkol kay Jesus."],[0,"When you believe that Jesus is God, you will be happy. Thomas, a follower of Jesus, did not believe Jesus had come back to life after cruel men had killed Jesus. However, Jesus did come back to life and He showed Himself to Thomas. When Thomas saw Jesus, he said, \"My Lord and my God! Jesus said to him, Thomas, because you have seen Me, you believe. Those are happy who have never seen Me and yet believe!\" (John 20:28-29 NLT).","當你相信耶穌是神，你會充滿喜樂。耶穌的門徒多馬，在殘暴的人殺害耶穌後，原本不相信耶穌已經復活。然而，耶穌真的復活了，並且向多馬顯現。多馬看見耶穌時說：「我的主，我的神！」耶穌對他說：「多馬，你因為看見了我才信；那些沒有看見就信的人是有福的！」（約翰福音20:28-29，意譯）","Kapag naniwala kang si Jesus ay Diyos, magiging masaya ka. Si Tomas, isang tagasunod ni Jesus, ay hindi naniwala na muling nabuhay si Jesus matapos Siyang patayin ng malulupit na tao. Ngunit talagang muling nabuhay si Jesus at nagpakita Siya kay Tomas. Nang makita ni Tomas si Jesus, sinabi niya, \"Panginoon ko at Diyos ko!\" Sinabi sa kanya ni Jesus, \"Tomas, dahil nakita mo Ako kaya ka naniwala. Mapalad ang mga hindi nakakita sa Akin ngunit naniniwala!\" (Juan 20:28-29)."],[0,"Men who did not believe Jesus was God killed Him. They thought that this would prove He was not God. But you cannot kill God. Jesus took His Spirit out of His body and allowed His body to die. Only Jesus' body bled and died. The blood that Jesus shed was shed for us that we might have life. After three days Jesus returned His Spirit to His body, came out of His grave and proved He was God. Jesus is still alive today. He has returned to heaven and sent His Spirit back to live in our lives if we will believe in Him.","不相信耶穌是神的人殺害了祂，以為這樣就能證明祂不是神。但人是殺不死神的。耶穌讓自己的靈離開身體，容許祂的身體死去。流血和死去的，只有耶穌的身體。耶穌流出的血是為了我們流的，使我們能得著生命。三天後，耶穌讓靈回到身體裡，從墳墓中復活出來，證明了祂就是神。耶穌今天仍然活著。祂已經回到天上，並且差派祂的靈，住在每一個信祂的人生命裡。","Ang mga taong hindi naniwala na si Jesus ay Diyos ang pumatay sa Kanya. Akala nila mapapatunayan nito na hindi Siya Diyos. Ngunit hindi mapapatay ang Diyos. Inalis ni Jesus ang Kanyang Espiritu sa Kanyang katawan at pinahintulutang mamatay ang Kanyang katawan. Ang katawan lamang ni Jesus ang nagdugo at namatay. Ang dugong ibinuhos ni Jesus ay ibinuhos para sa atin upang tayo ay magkaroon ng buhay. Pagkalipas ng tatlong araw, ibinalik ni Jesus ang Kanyang Espiritu sa Kanyang katawan, lumabas sa Kanyang libingan, at pinatunayang Siya ay Diyos. Buhay pa si Jesus hanggang ngayon. Bumalik Siya sa langit at isinugo ang Kanyang Espiritu upang manirahan sa ating buhay kung tayo ay maniniwala sa Kanya."],[1,"CONCLUSION","結論","KONKLUSYON"],[0,"The Bible clearly says there is only one Lord or God. \"The greatest law is this, 'Listen, Jewish People, The Lord our God is one Lord!' '(Mark 12:29 NLT). In order to be saved from the punishment of your sins, you must love the Lord God. \"You must love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength! This is the first law\" (Mark 12:30 NLT).","聖經清楚表明，只有一位主或神。「最重要的誡命（神的命令）就是：『以色列人哪，你們要聽！主我們的神是獨一的主。』」（馬可福音12:29，意譯） 為了從罪的懲罰中得救，你必須愛主神。「你要盡心、盡性、盡意、盡力愛主你的神。這是最重要的誡命。」（馬可福音12:30，意譯）","Malinaw na sinasabi ng Biblia na iisa lamang ang Panginoon o Diyos. \"Ang pinakamahalagang utos ay ito: 'Makinig ka, Israel: Ang Panginoon nating Diyos ay iisang Panginoon!'\" (Marcos 12:29). Upang maligtas sa parusa ng iyong mga kasalanan, kailangan mong ibigin ang Panginoong Diyos. \"Ibigin mo ang Panginoon mong Diyos nang buong puso, nang buong kaluluwa, nang buong pag-iisip, at nang buong lakas! Ito ang unang utos\" (Marcos 12:30)."],[0,"When you understand that Jesus is the Lord God, then you should love Him with all your heart, soul, mind, and strength. When you love Jesus, you will show your love by obeying the gospel of Jesus Christ. The gospel, or good news, of Jesus Christ is repentance, baptism in Jesus' name, and receiving the Holy Spirit (Acts 2:38). \"But these are written so you may believe that Jesus is the Christ, the Son of God. When you put your trust in Him, you-will have life that lasts forever through His name\" (John 20:31 NLT).","當你明白耶穌就是主神，你就應當盡心、盡性、盡意、盡力愛祂。當你愛耶穌，你會藉由順服耶穌基督的福音（好消息）來表達你的愛。耶穌基督的福音就是悔改（承認自己的罪，並轉離罪）、奉耶穌的名受洗（受洗時宣告耶穌的名），以及領受聖靈（使徒行傳2:38，意譯）。「但記載這些事，是要讓你們相信耶穌是基督，是神的兒子；並且讓你們信了祂，就可以因祂的名得著永遠的生命。」（約翰福音20:31，意譯）","Kapag naunawaan mong si Jesus ang Panginoong Diyos, dapat mo Siyang ibigin nang buong puso, kaluluwa, pag-iisip, at lakas. Kapag iniibig mo si Jesus, ipapakita mo ang iyong pag-ibig sa pamamagitan ng pagsunod sa ebanghelyo ni Jesu-Cristo. Ang ebanghelyo, o mabuting balita, ni Jesu-Cristo ay ang pagsisisi, pagpapabautismo sa pangalan ni Jesus, at pagtanggap ng Espiritu Santo (Gawa 2:38). \"Ngunit isinulat ang mga ito upang kayo ay sumampalataya na si Jesus ang Cristo, ang Anak ng Diyos. At kapag nagtiwala kayo sa Kanya, magkakaroon kayo ng buhay na walang hanggan sa pamamagitan ng Kanyang pangalan\" (Juan 20:31)."]]},{"id":"healing","t":{"en":"The Truth About Healing","zh":"關於醫治的真理","tl":"Ang Katotohanan Tungkol sa Pagpapagaling"},"p":[[1,"INTRODUCTION","引言","PANIMULA"],[0,"All men fear sickness. Men do not want to die. Educated men spend their lives searching for cures for men's sicknesses. Progress is made and doctors do help some illness, but some people become ill and die.","所有人都害怕生病，沒有人想死。受過良好教育的人窮盡一生尋找醫治人類疾病的方法。雖然醫學有了進展，醫生也確實能醫治某些疾病，但還是有人生病死去。","Lahat ng tao ay takot magkasakit. Ayaw ng tao na mamatay. Ginugugol ng mga edukadong tao ang kanilang buhay sa paghahanap ng lunas sa mga sakit. May pag-unlad, at nakatutulong ang mga doktor sa ilang karamdaman, ngunit may mga taong nagkakasakit pa rin at namamatay."],[0,"Sickness is the result of men's sin. Our ancestors, Adam and Eve, disobeyed God and God had to punish them. Sickness is a result of this punishment for sin. Since all men are born sinners, all men are troubled by sickness. However, God has provided a way for us to be healed when sickness does come.","疾病是因為人類犯罪，才進入這個世界的。我們的祖先亞當和夏娃不順服神，神不得不懲罰他們，疾病就是這個懲罰所帶來的結果。因為每個人生來就有罪性，所以每個人都會受到疾病的困擾。然而，當疾病來臨時，神已經為我們預備了得醫治的路。","Ang sakit ay bunga ng kasalanan ng tao. Ang ating mga ninuno na sina Adan at Eba ay sumuway sa Diyos, at kinailangan silang parusahan ng Diyos. Ang sakit ay bunga ng parusang ito sa kasalanan. Dahil lahat ng tao ay ipinanganak na makasalanan, lahat ng tao ay dinaranas ang sakit. Gayunpaman, naglaan ang Diyos ng paraan upang tayo ay mapagaling kapag dumating ang sakit."],[1,"GOD IS A HEALER","神是醫治者：","ANG DIYOS AY MANGGAGAMOT"],[0,"God promised His people in His Holy Writings, \"If you listen carefully to the voice of the Lord your God and do what is right in His eyes, if you pay attention to His commands and keep all his decrees, I will not bring on you any of the diseases I brought on the Egyptians, for I am the Lord who heals you\" (Exodus 15:26 NIV). God also warned them if they sin, \"He will bring upon you all the diseases of Egypt that you dreaded, and they will cling to you\" (Deuteronomy 28:60 NIV).","神在聖經中向祂的百姓應許：「如果你們留心聽主你們神的話，照著祂看為對的事去做，留心聽祂的誡命（神的命令），並遵守祂一切的規定，我就不把降在埃及人身上的任何疾病加在你們身上，因為我是醫治你們的耶和華。」（出埃及記15:26，意譯）神也警告他們，如果他們犯罪：「祂必使你們所懼怕、埃及的一切疾病臨到你們身上，緊緊纏著你們。」（申命記28:60，意譯）","Nangako ang Diyos sa Kanyang bayan sa Kanyang Banal na Kasulatan, \"Kung pakikinggan mong mabuti ang tinig ng Panginoon mong Diyos at gagawin ang tama sa Kanyang paningin, kung susundin mo ang Kanyang mga utos at iingatan ang lahat ng Kanyang mga tuntunin, hindi Ko ipararanas sa iyo ang alinman sa mga sakit na ipinadala Ko sa mga Ehipcio, sapagkat Ako ang Panginoon na nagpapagaling sa iyo\" (Exodo 15:26). Binalaan din sila ng Diyos na kung sila ay magkakasala, \"Ipararanas Niya sa iyo ang lahat ng sakit sa Ehipto na kinatatakutan mo, at kakapit ang mga ito sa iyo\" (Deuteronomio 28:60)."],[0,"God warned of sickness for those who disobey and promised healing to those who obeyed. God always keeps His promises.","神警告不順服的人會遭受疾病，並應許醫治那些順服的人。神總是信守祂的承諾。","Nagbabala ang Diyos ng sakit sa mga sumusuway at nangako ng kagalingan sa mga sumusunod. Laging tinutupad ng Diyos ang Kanyang mga pangako."],[0,"David, the Psalmist, praised God because \"He forgives all my sins and heals all my diseases\" (Psalms 103:3 NIV). Jeremiah reminds us of God's promise, \"But I will restore you to health and heal your wounds declares the Lord\" (Jeremiah 30:17 NIV). God loves His people and desires for them to be well and happy.","詩篇作者大衛讚美神，因為「祂赦免我的一切罪，醫治我的一切疾病」（詩篇103:3，意譯）。耶利米也提醒我們神的應許：「耶和華宣告：我必使你恢復健康，醫好你的傷口。」（耶利米書30:17，意譯）神愛祂的子民，渴望他們健康而且充滿喜樂。","Pinuri ni David, ang mang-aawit, ang Diyos dahil \"pinatatawad Niya ang lahat ng aking kasalanan at pinagagaling ang lahat ng aking karamdaman\" (Awit 103:3). Ipinaaalala sa atin ni Jeremias ang pangako ng Diyos: \"Ibabalik Ko ang iyong kalusugan at pagagalingin ang iyong mga sugat, sabi ng Panginoon\" (Jeremias 30:17). Mahal ng Diyos ang Kanyang bayan at nais Niyang sila ay maging malusog at masaya."],[0,"Healing is possible because of Jesus Christ. Jesus died for us so that we might be saved from the punishment of our sins. Yet, Jesus' crucifixion not only provided salvation, it provides healing. \"He carried our sins in His own body when He died on a cross. In doing this, we may be dead to sin and alive to all that is right and good. His wounds have healed you!\" (I Peter 2:24 NLT).","得醫治是可能的，這都是因為耶穌基督。耶穌為我們受死，好讓我們免於罪的刑罰而得救。然而，耶穌被釘十字架不僅帶來了救恩，也帶來了醫治。「祂在十字架上親自承擔了我們的罪，好讓我們跟罪斷絕關係，為一切正直良善的事而活。祂所受的傷使你們得了醫治！」（彼得前書2:24，意譯）","Posible ang kagalingan dahil kay Jesu-Cristo. Namatay si Jesus para sa atin upang tayo ay maligtas sa parusa ng ating mga kasalanan. Ngunit ang pagkakapako kay Jesus ay hindi lamang nagbigay ng kaligtasan, nagbibigay din ito ng kagalingan. \"Pinasan Niya ang ating mga kasalanan sa Kanyang sariling katawan nang Siya ay mamatay sa krus, upang tayo ay mamatay sa kasalanan at mabuhay para sa lahat ng tama at mabuti. Sa Kanyang mga sugat kayo ay gumaling!\" (I Pedro 2:24)."],[0,"Jesus made it possible and the Bible tells us how to receive it. \"Is anyone among you sick? He should send for the church leaders and they should pray for him. They should pour oil on him in the name of the Lord. The prayer given in faith will heal the sick man, and the Lord will raise him up. If he has sinned, he will be forgiven\" (James 5:14-15 NLT). Anoint with oil. Pray in Jesus' name. Pray with faith. Jesus will heal and forgive your sins.","耶穌成就了這一切，聖經也告訴我們該如何領受：「你們當中有人生病了嗎？他應該去請教會的長老，請他們為他禱告，並奉主的名用油抹他。出於信心的禱告會治好病人，主必使他好起來；他如果犯了罪，他的罪也會得到赦免。」（雅各書5:14-15，意譯）用油抹。奉耶穌的名禱告。憑著信心禱告。耶穌必醫治你，並赦免你的罪。","Ginawa itong posible ni Jesus, at sinasabi sa atin ng Biblia kung paano ito tatanggapin. \"May nagkakasakit ba sa inyo? Ipatawag niya ang mga namumuno sa iglesia at ipanalangin nila siya. Pahiran nila siya ng langis sa pangalan ng Panginoon. Ang panalanging may pananampalataya ay magpapagaling sa maysakit, at ibabangon siya ng Panginoon. Kung siya ay nagkasala, patatawarin siya\" (Santiago 5:14-15). Magpahid ng langis. Manalangin sa pangalan ni Jesus. Manalangin nang may pananampalataya. Pagagalingin ka ni Jesus at patatawarin ang iyong mga kasalanan."],[1,"EXAMPLES OF HEALING","醫治的例子：","MGA HALIMBAWA NG KAGALINGAN"],[0,"While Jesus was on earth, He healed many people. Jesus had power over all sickness. Sick people came from long distances to see Jesus so He could heal them. \"They brought all the sick people to Him with many kinds of disease and pains. They brought to Him those who had demons. They brought those who at times lose the use of their minds. They brought those who could not use their hands and legs. He healed them\" (Matthew 4:24 NLT). Sickness and demons had to flee at the command of Jesus.","當耶穌在地上時，祂醫治了許多人。耶穌有掌管一切疾病的能力。病人從很遠的地方趕來見耶穌，好讓祂醫治他們。「人們把患有各種疾病和疼痛的病人都帶到祂面前，也帶來了被惡魔附身的人、精神失常的人，以及癱瘓不能動的人。祂全都治好了。」（馬太福音4:24，意譯）在耶穌的命令下，疾病和惡魔都必須逃跑。","Noong si Jesus ay nasa lupa, marami Siyang pinagaling. May kapangyarihan si Jesus sa lahat ng sakit. Dumating ang mga maysakit mula sa malalayong lugar upang makita si Jesus at mapagaling Niya. \"Dinala nila sa Kanya ang lahat ng maysakit na may iba't ibang karamdaman at sakit. Dinala nila sa Kanya ang mga sinasapian ng demonyo, ang mga paminsan-minsang nawawala sa sarili, at ang mga hindi maigalaw ang kanilang mga kamay at paa. At pinagaling Niya sila\" (Mateo 4:24). Kinailangang tumakas ng sakit at mga demonyo sa utos ni Jesus."],[0,"Jesus gave His followers the power to heal. When they used the name of Jesus they also had power over diseases and demons (Luke 10:17). Jesus said that those who put their trust in Him would do special powerful works. \"They will put their hands on the sick and they will be healed\" (Mark 16:18 NLT).","耶穌賜給祂的門徒醫治的能力。當他們使用耶穌的名時，他們也擁有了勝過疾病和惡魔的能力（路加福音10:17）。耶穌說，信靠祂的人會做特別有能力的事：「他們把手放在病人身上，病人就會好起來。」（馬可福音16:18，意譯）","Binigyan ni Jesus ang Kanyang mga tagasunod ng kapangyarihang magpagaling. Kapag ginamit nila ang pangalan ni Jesus, nagkaroon din sila ng kapangyarihan sa mga sakit at demonyo (Lucas 10:17). Sinabi ni Jesus na ang mga nagtitiwala sa Kanya ay gagawa ng mga natatanging makapangyarihang gawa: \"Ipapatong nila ang kanilang mga kamay sa maysakit at gagaling ang mga ito\" (Marcos 16:18)."],[0,"The Bible tells of the followers of Jesus praying for a lame man (Acts 3). He was healed. Peter prayed for Dorcas who had died (Acts 9). She came back to life. Paul prayed for a man who had fallen out of a window and died (Acts 20). The people were happy to take the young man home alive.","聖經記載，耶穌的門徒為一個瘸腿的人禱告（使徒行傳第3章），他就得了醫治。彼得為已經死去的多加禱告（使徒行傳第9章），她就活了過來。保羅為一個從窗戶掉下去摔死的年輕人禱告（使徒行傳第20章），後來眾人非常高興能把這活生生的年輕人帶回家。","Ikinuwento ng Biblia ang mga tagasunod ni Jesus na nanalangin para sa isang pilay (Gawa 3). Siya ay gumaling. Nanalangin si Pedro para kay Dorcas na namatay na (Gawa 9). Siya ay muling nabuhay. Nanalangin si Pablo para sa isang lalaking nahulog mula sa bintana at namatay (Gawa 20). Masayang iniuwi ng mga tao ang binatang buhay."],[1,"CONCLUSION","結論","KONKLUSYON"],[0,"Followers of Jesus are still being healed. Jesus gave a gift of healing to the Church. He desires for us to use it. He wants His people to be well and happy.","跟隨耶穌的人至今依然在經歷醫治。耶穌把神所賜醫治的能力給了教會。祂渴望我們去運用它，祂希望祂的子民身體健康、充滿喜樂。","Patuloy na pinagagaling ang mga tagasunod ni Jesus hanggang ngayon. Nagbigay si Jesus ng kaloob na pagpapagaling sa Iglesia. Nais Niyang gamitin natin ito. Nais Niyang ang Kanyang bayan ay maging malusog at masaya."],[0,"God does not want you to be sick. Jesus suffered so you could be healed. If you will pray with faith calling on Jesus, He will heal you. People around the world are doing it. The leaders of the church are anointing with oil and praying in Jesus' name. Demons are being cast out. Blinded eyes are beginning to see. Deaf ears are beginning to hear and even the dead are coming back to life. God is still a healer. He wants to be your healer.","神不希望你生病。耶穌受苦，好讓你能得醫治。如果你憑信心禱告呼求耶穌，祂必醫治你。世界各地的人現在都正在這樣做。教會的長老們正用油抹並奉耶穌的名禱告。惡魔被趕逐出去，瞎眼的得以看見，耳聾的得以聽見，甚至死人也復活了。神至今依然是醫治者，祂渴望成為你的醫治者。","Hindi nais ng Diyos na ikaw ay magkasakit. Nagdusa si Jesus upang ikaw ay gumaling. Kung mananalangin ka nang may pananampalataya at tatawag kay Jesus, pagagalingin ka Niya. Ginagawa ito ng mga tao sa buong mundo. Ang mga pinuno ng iglesia ay nagpapahid ng langis at nananalangin sa pangalan ni Jesus. Napapalayas ang mga demonyo. Nakakakita na ang mga bulag. Nakaririnig na ang mga bingi, at maging ang mga patay ay muling nabubuhay. Ang Diyos ay manggagamot pa rin. Nais Niyang maging manggagamot mo."]]},{"id":"church","t":{"en":"The Truth About the Church","zh":"關於教會的真理","tl":"Ang Katotohanan Tungkol sa Iglesia"},"p":[[1,"INTRODUCTION","引言","PANIMULA"],[0,"We live in a time that we call the \"Church Age.\" During this time God is preparing a body of people that is called His Church. These people, the Church, are also called the body of Christ. Jesus is the head of the Church, \"For a husband is the head of his wife as Christ is the head of the Church. It is His body (the Church) that He saves\" (Ephesians 5:23 NLT). To be saved you must be in the Church.","我們現在所處的時代，稱為「教會時代」。在這段時間裡，神正在預備一群人，這群人就是祂的教會，也稱為基督的身體。耶穌是教會的頭：「丈夫是妻子的頭，就像基督是教會的頭一樣；祂所拯救的，就是祂的身體，也就是教會。」（以弗所書5:23，意譯）人要得救，就必須在教會裡。","Nabubuhay tayo sa panahong tinatawag nating \"Panahon ng Iglesia.\" Sa panahong ito, inihahanda ng Diyos ang isang kalipunan ng mga tao na tinatawag na Kanyang Iglesia. Ang mga taong ito, ang Iglesia, ay tinatawag ding katawan ni Cristo. Si Jesus ang ulo ng Iglesia: \"Sapagkat ang asawang lalaki ang ulo ng kanyang asawa, gaya ni Cristo na ulo ng Iglesia. Ang Kanyang katawan (ang Iglesia) ang Kanyang inililigtas\" (Efeso 5:23). Upang maligtas, kailangan mong mapabilang sa Iglesia."],[1,"HOW DO YOU GET INTO THE CHURCH?","怎樣才能成為教會的一員？","PAANO KA MAPAPABILANG SA IGLESIA?"],[0,"You have to be born into the Church. This birth is not the birth of being born of your mother. You must be born again. Jesus told Nicodemus, \"Do not be surprised that I said to you 'You must be born again'\" (John 3:7 NLT). Jesus had told Nicodemus that he must be born of the water and of the Spirit or he could not see the holy nation of God (John 3:5 NLT).","要成為教會的一員，你必須經歷一次「出生」。這不是指從母親腹中出生，而是重生（生命重新開始）。耶穌對尼哥底母說：「我說『你們必須重生』，你不要覺得奇怪。」（約翰福音3:7，意譯）耶穌也告訴尼哥底母，人若不是從水和聖靈重生（受洗並領受聖靈），就不能看見神的國（約翰福音3:5）。","Kailangan kang maipanganak sa Iglesia. Hindi ito ang kapanganakan mula sa iyong ina. Kailangan kang ipanganak na muli. Sinabi ni Jesus kay Nicodemo, \"Huwag kang magtaka na sinabi Ko sa iyo, 'Kailangan kang ipanganak na muli'\" (Juan 3:7). Sinabi ni Jesus kay Nicodemo na kailangan siyang ipanganak sa tubig at sa Espiritu, kung hindi ay hindi niya makikita ang banal na kaharian ng Diyos (Juan 3:5)."],[0,"In Acts chapter 2 the first people were born into the Church. \"All at once there was a sound from heaven like a powerful wind. It filled the house where they were sitting. Then they saw tongues.... These came down on each of them. They were all filled with the Holy Spirit. Then they began to speak in other languages which the Holy Spirit made them able to speak\" (Acts 2:2-4 NLT).","使徒行傳第2章記載了最早因重生而成為教會一員的人：「忽然，從天上傳來一陣像強風的聲音，充滿了他們所坐的整間屋子。接著，他們看見像火焰一樣的舌頭……分別落在每個人身上。他們全都被聖靈充滿，並照著聖靈的帶領，開始說出別種語言。」（使徒行傳2:2-4，意譯）","Sa Gawa kabanata 2, ang mga unang tao ay ipinanganak sa Iglesia. \"Biglang may ugong mula sa langit na tulad ng malakas na hangin. Pinuno nito ang buong bahay na kanilang kinauupuan. Pagkatapos ay nakakita sila ng mga dila... Dumapo ang mga ito sa bawat isa sa kanila. Silang lahat ay napuspos ng Espiritu Santo. At nagsimula silang magsalita ng ibang mga wika ayon sa ibinigay sa kanila ng Espiritu Santo\" (Gawa 2:2-4)."],[0,"There were one hundred and twenty people who were first born into the Church. However, many people saw what was happening and asked how they also could enter the Church. \"Peter said to them, 'Be sorry for your sins and turn from them and be baptized in the name of Jesus Christ, and your sins will be forgiven, You will receive the gift of the Holy Spirit'\" (Acts 2:38 NLT).","最早這樣重生的有一百二十人。許多人看見所發生的事，也問要怎樣才能成為教會的一員。「彼得對他們說：『你們要為自己的罪難過，並且轉離罪，奉耶穌基督的名受洗，你們的罪就會得到赦免，也會領受神所賜的聖靈。』」（使徒行傳2:38，意譯）","Isandaan at dalawampung tao ang unang ipinanganak sa Iglesia. Ngunit maraming tao ang nakakita ng nangyayari at nagtanong kung paano rin sila makapapasok sa Iglesia. \"Sinabi sa kanila ni Pedro, 'Pagsisihan ninyo ang inyong mga kasalanan at talikuran ang mga ito, at magpabautismo kayo sa pangalan ni Jesu-Cristo, at patatawarin ang inyong mga kasalanan. Tatanggapin ninyo ang kaloob na Espiritu Santo'\" (Gawa 2:38)."],[0,"Three thousand people obeyed Peter's words and were also born into the Church that day. This took place on the Day of Pentecost (a Jewish feast). We call the Church that was born that day the Pentecostal Church.","那一天，有三千人聽從彼得的話，也重生成為教會的一員。這件事發生在五旬節（猶太人的節日），所以我們把那天誕生的教會稱為五旬節教會。","Tatlong libong tao ang sumunod sa mga salita ni Pedro at ipinanganak din sa Iglesia nang araw na iyon. Nangyari ito sa Araw ng Pentecostes (isang pista ng mga Judio). Tinatawag natin ang Iglesiang isinilang nang araw na iyon na Iglesiang Pentecostal."],[0,"The saved body of Christ, the Church, was growing rapidly. It continued to grow as was promised. \"This promise is to you and your children. It is to all people everywhere. It is to as many as the Lord our God will call\" (Acts 2:39 NLT).","教會是蒙神拯救的基督身體，不但增長得非常快，而且照著神的應許持續增長：「這個應許是給你們和你們的子孫，也是給世界各地所有被主我們的神呼召的人。」（使徒行傳2:39，意譯）","Mabilis na lumago ang ligtas na katawan ni Cristo, ang Iglesia. Patuloy itong lumago gaya ng ipinangako: \"Ang pangakong ito ay para sa inyo at sa inyong mga anak. Ito ay para sa lahat ng tao saanman, sa lahat ng tatawagin ng Panginoon nating Diyos\" (Gawa 2:39)."],[0,"You also may be born into the Church. You must be born again just as the first believers were born into it. Some would like to teach that there is another way, but there is none. \"No! There is not another kind of good news. There are some who would like to lead you in the wrong way\" (Galatians 1:7 NLT). God warns us about false teachers and we must be careful that they do not lead us the wrong way.","你也可以成為教會的一員，方法跟最早的信徒一樣，就是重生。有些人會教導說還有別的方法，其實沒有。「不！沒有另一種福音。只是有些人想把你們帶上錯誤的道路。」（加拉太書1:7，意譯）神提醒我們要提防傳錯誤教導的人，我們必須小心，不要被他們帶上錯誤的道路。","Maaari ka ring maipanganak sa Iglesia. Kailangan kang ipanganak na muli gaya ng mga unang mananampalataya. May mga nagnanais magturo na may iba pang paraan, ngunit wala. \"Hindi! Walang ibang uri ng mabuting balita. May mga taong nais kayong iligaw\" (Galacia 1:7). Binabalaan tayo ng Diyos tungkol sa mga bulaang guro, at kailangan nating mag-ingat na hindi nila tayo mailigaw."],[0,"The Bible tells of many others who were born into the Church by repenting, being baptized in Jesus' name, and receiving the Holy Ghost. The Samaritans (Acts 8), Cornelius' family and friends (Acts 10), and the Ephesians (Acts 19) also spoke in new languages as they were born into the Church.","聖經還記載了許多人，藉著悔改、奉耶穌的名受洗（受洗時宣告耶穌的名）和領受聖靈而重生，成為教會的一員。撒瑪利亞人（使徒行傳第8章）、哥尼流的家人和朋友（使徒行傳第10章）、以弗所人（使徒行傳第19章），在重生的時候，也都和五旬節那天一樣說了方言。","Isinasalaysay ng Biblia ang marami pang ibang ipinanganak sa Iglesia sa pamamagitan ng pagsisisi, pagpapabautismo sa pangalan ni Jesus, at pagtanggap ng Espiritu Santo. Ang mga taga-Samaria (Gawa 8), ang pamilya at mga kaibigan ni Cornelio (Gawa 10), at ang mga taga-Efeso (Gawa 19) ay nagsalita rin ng mga bagong wika nang sila ay ipanganak sa Iglesia."],[0,"In a short time it was said of the Christians (another name for the Church) that they had filled Jerusalem with their teachings. Later people were saying that the Church had turned the world upside down with the good news of salvation through Jesus.","沒多久，人們就說基督徒（教會的另一個名稱）的教導已經傳遍了整個耶路撒冷。後來，人們更說，教會用耶穌拯救人的好消息，把整個世界都翻轉過來了。","Sa maikling panahon, sinabi tungkol sa mga Kristiyano (isa pang pangalan ng Iglesia) na pinuno nila ang Jerusalem ng kanilang mga turo. Nang lumaon, sinasabi ng mga tao na binaligtad ng Iglesia ang mundo sa pamamagitan ng mabuting balita ng kaligtasan kay Jesus."],[1,"REFORMATION","宗教改革","REPORMASYON"],[0,"Not all people understand the warnings about wrong ways and false teachings. Some began to follow the teachings of men and not the teaching of God. They claimed to be a part of the Church, but they were not. The true Church of Jesus Christ was still called by His name and filled with His Spirit. However, false teachers gained control of the organized church and the government.","可惜，並不是每個人都明白聖經對錯誤教導的警告。有些人開始跟從人的教導，而不是神的教導。他們自稱是教會的一部分，其實並不是。真正屬於耶穌基督的教會，仍然歸在祂的名下，也被祂的靈充滿。然而，掌控當時主流教會和政府的，卻是那些自稱屬於教會的人。","Hindi lahat ng tao ay nakauunawa sa mga babala tungkol sa maling daan at maling turo. Ang ilan ay nagsimulang sumunod sa mga turo ng tao at hindi sa turo ng Diyos. Sinabi nilang bahagi sila ng Iglesia, ngunit hindi. Ang tunay na Iglesia ni Jesu-Cristo ay tinatawag pa rin sa Kanyang pangalan at puspos ng Kanyang Espiritu. Gayunpaman, nakuha ng mga bulaang guro ang kontrol sa organisadong simbahan at sa pamahalaan."],[0,"People who taught that you have to repent, be baptized in Jesus' name, and speak with new tongues when you received the Holy Spirit were persecuted. They still believed the teachings of the Bible. They did not listen to ungodly men who controlled the organized church. Many people died because they stood for truth. Finally more organized church leaders began to stand against false teachings. They tried to lead the organized church back to Bible teachings. Men like John Wycliffe, John Huss, Savonarola, and Martin Luther led what is called the Reformation. They suffered greatly to try to lead men back to Bible truths. False teachers persecuted them because of the truths they taught.","那些教導人必須悔改、奉耶穌的名受洗，並在領受聖靈時說方言的人，都遭到逼迫。但他們仍然相信聖經的教導，不肯聽從那些掌控主流教會、卻不敬畏神的人。許多人為了堅守真理而喪命。後來，主流教會裡也有越來越多領袖站出來反對錯誤的教導，想帶領教會回到聖經。威克利夫、胡斯、薩佛納羅拉和馬丁路德這些人，帶領了歷史上所說的宗教改革。他們為了帶人回到聖經的真理受了許多苦，也因為傳講真理而遭到逼迫。","Ang mga nagtuturo na kailangang magsisi, magpabautismo sa pangalan ni Jesus, at magsalita ng mga bagong wika kapag tinanggap ang Espiritu Santo ay inusig. Patuloy silang naniwala sa mga turo ng Biblia. Hindi sila nakinig sa mga taong hindi maka-Diyos na kumokontrol sa organisadong simbahan. Maraming namatay dahil sa paninindigan sa katotohanan. Sa wakas, mas maraming pinuno ng organisadong simbahan ang nagsimulang tumindig laban sa maling turo. Sinikap nilang ibalik ang organisadong simbahan sa mga turo ng Biblia. Ang mga taong tulad nina John Wycliffe, John Huss, Savonarola, at Martin Luther ang nanguna sa tinatawag na Repormasyon. Labis silang nagdusa sa pagsisikap na ibalik ang mga tao sa katotohanan ng Biblia. Inusig sila ng mga bulaang guro dahil sa mga katotohanang kanilang itinuro."],[1,"RETURN TO PENTECOST","回到五旬節","PAGBABALIK SA PENTECOSTES"],[0,"In the early 1900's, in Topeka, Kansas, U.S.A., there was a group of people who were born again of the Spirit. Just like on the Day of Pentecost, they spoke with new tongues as God filled them with the Holy Spirit. Since then millions of people around the world have received the Holy Spirit, evidenced by speaking in new languages.","二十世紀初，在美國堪薩斯州的托皮卡，有一群人從聖靈重生。就像五旬節那天一樣，當神用聖靈充滿他們時，他們都說了方言。從那時到現在，全世界已經有數百萬人領受了聖靈，並且都有說方言作為證據。","Noong unang bahagi ng 1900s, sa Topeka, Kansas, U.S.A., may isang grupo ng mga taong ipinanganak na muli sa Espiritu. Gaya ng nangyari sa Araw ng Pentecostes, nagsalita sila ng mga bagong wika nang punuin sila ng Diyos ng Espiritu Santo. Mula noon, milyun-milyong tao sa buong mundo ang tumanggap ng Espiritu Santo, na pinatutunayan ng pagsasalita ng mga bagong wika."],[0,"The Holy Spirit, who comes to lead and guide into all truth, has shown many of these people that they must be baptized in Jesus' name also. This is the way the people who were born into the Church in the Bible were baptized. Baptism in Jesus' name was part of Peter's teachings on the Day of Pentecost. Men of God around the world are preaching the full message of salvation as found in the Bible.","聖靈來，是要引導人明白一切的真理；祂也讓許多領受了聖靈的人明白，他們還必須奉耶穌的名受洗。聖經裡重生成為教會一員的人，就是這樣受洗的；五旬節那天，彼得的教導也包括奉耶穌的名受洗。今天，世界各地的傳道人都在傳講聖經裡神拯救人的完整信息。","Ang Espiritu Santo, na dumarating upang manguna at gumabay sa lahat ng katotohanan, ay nagpakita sa marami sa kanila na kailangan din silang magpabautismo sa pangalan ni Jesus. Ganito binautismuhan ang mga taong ipinanganak sa Iglesia sa Biblia. Ang bautismo sa pangalan ni Jesus ay bahagi ng mga turo ni Pedro sa Araw ng Pentecostes. Ang mga lingkod ng Diyos sa buong mundo ay nangangaral ng buong mensahe ng kaligtasan ayon sa Biblia."],[0,"In 1945 two organizations who preached this message joined together to form the United Pentecostal Church. Our basic teaching is:","1945年，兩個傳講這個信息的團體合併，成立了聯合五旬節教會。我們的基本教導是：","Noong 1945, dalawang organisasyon na nangangaral ng mensaheng ito ang nagsama upang bumuo ng United Pentecostal Church. Ang aming pangunahing turo ay:"],[0,"\"The basic and fundamental doctrine of this organization shall be the Bible standard of full salvation, which is repentance, baptism in water by immersion in the name of the Lord Jesus Christ, and the baptism of the Holy Ghost with the initial sign of speaking with other tongues as the Spirit gives utterance. We shall endeavor to keep the unity of the Spirit until we all come into the unity of the faith, at the same time admonishing all brethren that they shall not contend for their different views to the disunity of the body.\"","「本會最根本的教義，是聖經所定完整救恩的標準，就是：悔改；奉主耶穌基督的名，全身浸入水中受洗；以及受聖靈的洗，而最初的證據，就是照著聖靈的帶領說方言。我們要盡力維持聖靈帶來的合一，直到大家在信仰上完全一致；同時也勸勉所有弟兄姊妹，不要為了各自不同的看法爭論導致教會分裂。」","\"Ang pangunahin at saligang doktrina ng organisasyong ito ay ang pamantayan ng Biblia ng ganap na kaligtasan, na binubuo ng pagsisisi, bautismo sa tubig sa pamamagitan ng paglulubog sa pangalan ng Panginoong Jesu-Cristo, at bautismo ng Espiritu Santo na may unang tanda ng pagsasalita ng ibang mga wika ayon sa ibinibigay ng Espiritu. Sisikapin naming ingatan ang pagkakaisa ng Espiritu hanggang makamtan nating lahat ang pagkakaisa ng pananampalataya, kasabay ng pagpapaalala sa lahat ng kapatiran na huwag ipaglaban ang kani-kanilang magkakaibang pananaw hanggang sa magdulot ito ng pagkakawatak-watak ng katawan.\""],[0,"Articles of Faith, Manual, United Pentecostal Church International, (Inc.)","——《聯合五旬節教會國際總會手冊》〈信仰條款〉","Articles of Faith, Manual, United Pentecostal Church International, (Inc.)"],[1,"CONCLUSION","結論","KONKLUSYON"],[0,"\"On this rock I will build My church. The powers of hell will not be able to have power over my Church\" (Matthew 16:18 NLT). Jesus is still building His Church. You can be a part of it, but you must be born again just as the early Church was. Those who are born into His body and live a holy life for Jesus are the ones that He is going to take to heaven to live with Him forever.","「我要把我的教會建造在這塊磐石上，地獄的權勢也不能勝過它。」（馬太福音16:18，意譯）耶穌今天仍在建造祂的教會，你也可以加入。不過，你必須像早期的信徒一樣重生。凡是重生、成為祂身體一部分，並且為耶穌過聖潔生活的人，耶穌將來都要帶他們到天上，永遠和祂同住。","\"Sa batong ito ay itatayo Ko ang Aking Iglesia. Hindi ito mapagtatagumpayan ng kapangyarihan ng impiyerno\" (Mateo 16:18). Patuloy na itinatayo ni Jesus ang Kanyang Iglesia. Maaari kang maging bahagi nito, ngunit kailangan kang ipanganak na muli gaya ng unang Iglesia. Ang mga ipinanganak sa Kanyang katawan at namumuhay nang banal para kay Jesus ang Kanyang dadalhin sa langit upang makasama Niya magpakailanman."]]}];

/* ---------- Helpers ---------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (k, n) => { const d = new Date(k+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const TODAY = ymd(new Date());
const loadJSON = (k, d) => { try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } };
const saveJSON = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

function api(fn, ...args){
  return fetch(API_URL, { method:'POST', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
                          body: JSON.stringify({ fn, args }) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => { if (!j || !j.ok) throw new Error((j && j.error) || 'ERR'); return j.data; });
}
function errMsg(e){
  const m = String((e && e.message) || e || '');
  const k = ['NOT_STAFF','BAD_CODE','NO_PERMISSION','NEED_TITLE','NEED_NAME','NEED_TEXT','SLOT_TAKEN','NOT_FOUND','CANNOT_DISABLE_SELF','NEED_CONTACT'].find(x => m.indexOf(x) >= 0);
  return k ? t('e'+k) : t('netErr');
}
function addToken(tok){ if (tok && !TOKENS.includes(tok)){ TOKENS.push(tok); saveJSON('fact-tokens', TOKENS); } }
function applyData(d){
  POSTS = d.posts || []; ARTS = d.articles || []; CHAINS = d.chains || []; PRAYERS = d.prayers || [];
  ME = d.me || null;
  if (CODE && !ME){ CODE = ''; store.set('fact-code', ''); }
  S.staff = !!ME && ME.role !== 'translator';
  S.tr = !!ME && ME.role === 'translator';
  LOADED = true; LOAD_ERR = false;
}
async function reload(){
  if (!S.home) return;
  try{
    const d = await api('api_load', S.home, CODE, TOKENS);
    applyData(d);
    saveJSON('fact-cache-' + S.home, d);
  }catch(e){ LOAD_ERR = !LOADED; if (LOADED) toast(errMsg(e)); }
  render();
}

function shortDate(k){

  return `${DOW[S.lang][d.getDay()]}, ${S.lang==='tl'?m:m.slice(0,3)} ${d.getDate()}`;
}

  let s = shortDate(p.date);

/* calendar entries: each dated post on each of its days + its deadline */
function entries(from, to){
  const out = [];
  POSTS.filter(inFilter).filter(p => kindOf(p)==='event').forEach(p => {
    if (p.date){
      let k = p.date, last = p.endDate && p.endDate >= p.date ? p.endDate : p.date;
      while (k <= last){ if (k >= from && k <= to) out.push({ key:k, p, dl:false }); k = addDays(k, 1); }
    }
    if (p.deadline && p.deadline >= from && p.deadline <= to) out.push({ key:p.deadline, p, dl:true });
  });
  return out.sort((a,b)=> a.key.localeCompare(b.key) || (a.dl - b.dl) || (a.p.start||'').localeCompare(b.p.start||''));
}
const dotColor = p => p.church==='all' ? 'var(--navy)' : churchOf(p.church).color;

function entryRow(e){
  const d = new Date(e.key+'T00:00:00'), p = e.p;
  const label = e.dl ? `${t('dlShort')}：${esc(L(p.title))}` : esc(L(p.title));
  const sub = e.dl ? '' : (p.start ? `${p.start}${p.end?'–'+p.end:''} · ` : '');
  return `<div class="ev ${e.dl?'dl':''}">
    <div class="date"><b>${d.getDate()}</b><i>${S.lang==='zh' ? '週'+DOW.zh[d.getDay()] : DOW[S.lang][d.getDay()]}</i></div>
    <div class="info" onclick="openDetail('${p.id}')"><b>${e.dl?svg('flag')+' ':''}${label}</b><span>${sub}</span>${chip(p.church)}</div>
    ${(S.staff||S.tr) ? `<button class="icon-btn edit" onclick="openEditor('${p.id}')">${svg('pen')}</button>`
      : (e.dl ? '' : `<a class="icon-btn" title="${t('addCal')}" href="${calLink(p)}" target="_blank" rel="noopener">${svg('plus')}</a>`)}
  </div>`;
}
function postCard(p, pinned){
  return `<div class="card post ${pinned?'pin':''}" onclick="openDetail('${p.id}')">
    ${p.img?`<img class="pimg" src="${esc(p.img)}" loading="lazy" alt="">`:''}
    ${(S.staff||S.tr)?`<button class="icon-btn edit" style="float:right" onclick="event.stopPropagation();openEditor('${p.id}')">${svg('pen')}</button>`:''}
    ${pinned?`<span class="tag">\u{1F4CC} ${t('pinned')}</span>`:''}${p.demo?`<span class="demo">${t('protoNote')}</span>`:''}
    <h3>${esc(L(p.title))}${linkOf(p)?`<span class="fbtag" style="color:${isYt(linkOf(p))?'#E62117':'#1877F2'}">${svg(isYt(linkOf(p))?'yt':'fb',2)}</span>`:''}</h3>
    ${p.date||p.church!=='all' ? `<div class="meta">${p.date?`<span>${svg('clock')}${whenText(p)}</span>`:''}${chip(p.church)}</div>` : ''}
    ${p.deadline ? `<div class="meta deadline">${svg('flag')}${t('deadline')} ${shortDate(p.deadline)}</div>` : ''}
    ${L(p.body)?`<p>${esc(L(p.body))}</p>`:''}
  </div>`;
}

function viewCal(){
  const head = `<div class="h2row"><h2>${t('cal')}</h2>${S.staff?`<button class="addbtn" onclick="openEditor(null, S.sel)">${svg('plus')}${t('addPost')}</button>`:''}</div>
  <div class="seg"><button class="${S.calView==='month'?'on':''}" onclick="setV('month')">${t('month')}</button>
    <button class="${S.calView==='list'?'on':''}" onclick="setV('list')">${t('list')}</button></div>`;
  const foot = `<a class="linkrow" onclick="go('churches')">${svg('church')}${t('regular')} ›</a>`;
  if (S.calView === 'list'){
    const ev = entries(TODAY, addDays(TODAY, 90));
    return `${head}<p class="note">${t('next90')}</p>
      <div class="card">${ev.length ? ev.map(entryRow).join('') : `<p class="empty">${t('noUp')}</p>`}</div>${foot}`;
  }
  const [y, m] = S.ym;
  const first = new Date(y, m, 1), g0 = new Date(y, m, 1 - first.getDay());
  const from = ymd(g0), to = addDays(from, 41);
  const byDay = {}; entries(from, to).forEach(e => (byDay[e.key] = byDay[e.key] || []).push(e));
  let cells = DOW[S.lang].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < 42; i++){
    const k = addDays(from, i), d = new Date(k+'T00:00:00'), list = byDay[k] || [];
    const dots = list.slice(0,4).map(e => e.dl ? `<i style="background:#fff;border:1.5px solid var(--wine);width:7px;height:7px"></i>`
                                              : `<i style="background:${dotColor(e.p)}"></i>`).join('');
    cells += `<div class="d ${d.getMonth()!==m?'out':''} ${k===TODAY?'today':''} ${k===S.sel?'sel':''}" onclick="selDay('${k}')">
      <b>${d.getDate()}</b><div class="dots">${dots}</div></div>`;
  }
  const title = S.lang==='zh' ? `${y} 年 ${m+1} 月` : `${MON[S.lang==='tl'?'tl':'en'][m]} ${y}`;
  const selEv = (byDay[S.sel] || []);
  return `${head}
  <div class="card"><div class="mhead"><button class="icon-btn" onclick="mv(-1)">${svg('left')}</button><b>${title}</b>
    <button class="icon-btn" onclick="mv(1)">${svg('right')}</button></div><div class="grid">${cells}</div></div>
  <h2>${shortDate(S.sel)}</h2>
  <div class="card">${selEv.length ? selEv.map(entryRow).join('') : `<p class="empty">${t('noEv')}</p>`}</div>${foot}`;
}

const kindOf = p => p.kind || (p.date ? 'event' : 'news');
const linkOf = p => p.link || p.fb || '';
const isYt = u => /^https:\/\/((www|m)\.)?(youtube\.com|youtu\.be)\//i.test(u||'');
const linkOk = u => isYt(u) || fbOk(u);
function ytId(u){ const m = String(u).match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/); return m ? m[1] : ''; }
function embedLink(u, w){
  if (isYt(u)){ const id = ytId(u); return id ? `<iframe src="https://www.youtube-nocookie.com/embed/${id}" width="${w}" height="${Math.round(w*0.5625)}" allow="encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>` : ''; }
  if (/\/share\//i.test(u)) return '';
  return fbEmbed(u, w);
}
function linkBtn(u){ return isYt(u) ? `<a class="fbbtn" style="background:#E62117" href="${esc(u)}" target="_blank" rel="noopener">${svg('yt',2)}${t('openYt')}</a>`
  : `<a class="fbbtn" href="${esc(u)}" target="_blank" rel="noopener">${svg('fb',2)}${t('viewFb')}</a>`; }
function fbOk(u){ return /^https:\/\/((www|m|web)\.)?(facebook\.com|fb\.watch)\//i.test(u||''); }
function fbEmbed(u, w){
  const vid = /\/videos?\/|\/watch|\/reel\/|fb\.watch/i.test(u);
  const q = 'href=' + encodeURIComponent(u) + '&show_text=true&width=' + w;
  return vid ? `<iframe src="https://www.facebook.com/plugins/video.php?${q}" width="${w}" height="${Math.round(w*0.56)+160}" scrolling="no" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`
             : `<iframe src="https://www.facebook.com/plugins/post.php?${q}" width="${w}" height="520" scrolling="no" allow="clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
}

function chainCard(c){
  const slots = [];
  for (let d = 0; d < c.days; d++){
    const day = addDays(c.start, d);
    const list = [];
    for (let m = c.from*60; m < c.to*60; m += c.step){
      const hh = String(Math.floor(m/60)).padStart(2,'0'), mm = String(m%60).padStart(2,'0');
      list.push({ key:`${day}T${hh}:${mm}`, label:`${hh}:${mm}` });
    }
    slots.push({ day, list });
  }
  const total = slots.reduce((n,d)=>n+d.list.length,0), taken = Object.keys(c.slots).length;
  return `<div class="card chain">
    ${S.staff?`<button class="icon-btn edit" style="float:right" onclick="openChainEditor('${c.id}')">${svg('pen')}</button>`:''}
    ${c.demo?`<span class="demo" style="margin-left:0">${t('protoNote')}</span>`:''}
    <h3>${esc(L(c.title))}</h3>
    <div class="meta"><span>${svg('clock')}${shortDate(c.start)}${c.days>1?' – '+shortDate(addDays(c.start,c.days-1)):''}</span>${chip(c.church)}</div>
    <div class="progress"><i style="width:${total?Math.round(taken/total*100):0}%"></i></div>
    <small style="color:var(--muted)">${taken} / ${total} ${t('filled')}</small>
    ${slots.map(d => `<div class="day">${shortDate(d.day)}</div><div class="slots">
      ${d.list.map(sl => { const who = c.slots[sl.key];
        return `<button class="slot ${who?'taken':''} ${who && who.mine?'me':''}" onclick="openSlot('${c.id}','${sl.key}')"><b>${sl.label}</b><span>${who?esc(who.name):t('open')}</span></button>`; }).join('')}
    </div>`).join('')}
  </div>`;
}
function monthChain(){
  const ym = S.mcYm || TODAY.slice(0,7), [y,m] = ym.split('-').map(Number);
  const cid = `m-${S.home}-${ym}`, c = CHAINS.find(x => x.id === cid) || { slots:{} };
  const first = new Date(y, m-1, 1).getDay(), n = new Date(y, m, 0).getDate();
  const title = S.lang==='zh' ? `${y} 年 ${m} 月` : `${MON[S.lang==='tl'?'tl':'en'][m-1]} ${y}`;
  const cells = [];
  for (let i = 0; i < first; i++) cells.push('<div class="blank"></div>');
  let filled = 0;
  for (let d = 1; d <= n; d++){
    const key = `${ym}-${String(d).padStart(2,'0')}`, who = c.slots[key]; if (who) filled++;
    cells.push(`<button class="${who?'taken':''} ${who&&who.mine?'me':''} ${key===TODAY?'today':''} ${key<TODAY?'past':''}" onclick="openMSlot('${key}')"><b>${d}</b><span>${who?esc(who.name):''}</span></button>`);
  }
  const DW = S.lang==='zh' ? DOW.zh.map(x=>x) : DOW[S.lang];
  return `<div class="card">
    <div class="mhead"><button class="icon-btn" onclick="mvMc(-1)">${svg('left')}</button><b>${t('mcTitle')} · ${title}</b><button class="icon-btn" onclick="mvMc(1)">${svg('right')}</button></div>
    <p class="note" style="padding:0 2px 4px">${t('mcHint')}</p>
    <div class="mgrid">${DW.map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div>
    <small style="color:var(--muted);display:block;margin-top:8px">${filled} / ${n} ${t('daysFilled')}</small></div>`;
}
function mvMc(k){ let [y,m] = (S.mcYm || TODAY.slice(0,7)).split('-').map(Number); m += k; if (m<1){m=12;y--;} if (m>12){m=1;y++;}
  S.mcYm = `${y}-${String(m).padStart(2,'0')}`; render(); }
function openMSlot(key){
  const ym = key.slice(0,7), cid = `m-${S.home}-${ym}`, c = CHAINS.find(x => x.id === cid) || { slots:{} }, who = c.slots[key];

}

/* ---------- Actions ---------- */
let HDEPTH = 0, SHEET_PUSHED = false, IGNORE_POP = false;
function go(tab, fromPop){
  if (!fromPop && tab !== S.tab){ try{ history.pushState({ tab }, ''); HDEPTH++; }catch(e){} }
  S.tab = tab; render(); window.scrollTo(0,0);
  if (tab === 'new') hit('p:new'); else if (tab === 'beliefs') hit('p:beliefs');
}
function goBack(){ if (HDEPTH > 0) history.back(); else go(NAVKEY[S.tab] || 'home'); }
window.addEventListener('popstate', ev => {
  if (IGNORE_POP){ IGNORE_POP = false; return; }
  const sh = document.getElementById('sheet');
  if (SHEET_PUSHED || (sh && sh.className === 'open')){ SHEET_PUSHED = false; HDEPTH = Math.max(0, HDEPTH-1); if (sh) sh.className = ''; ED = null; return; }
  HDEPTH = Math.max(0, HDEPTH-1);
  go((ev.state && ev.state.tab) || 'home', true);
});
(function(){
  const sh = document.getElementById('sheet'); if (!sh || !window.MutationObserver) return;
  new MutationObserver(() => {
    const open = sh.className === 'open';
    if (open && !SHEET_PUSHED){ try{ history.pushState({ tab: S.tab, sheet: 1 }, ''); HDEPTH++; SHEET_PUSHED = true; }catch(e){} }
    else if (!open && SHEET_PUSHED){ SHEET_PUSHED = false; IGNORE_POP = true; HDEPTH = Math.max(0, HDEPTH-1); history.back(); }
  }).observe(sh, { attributes:true, attributeFilter:['class'] });
})();
try{ history.replaceState({ tab: S.tab }, ''); }catch(e){}
function setF(f){ S.filter = f; render(); }
function setV(v){ S.calView = v; render(); }
function selDay(k){ S.sel = k; render(); }
function mv(n){ let [y,m] = S.ym; m += n; if (m<0){m=11;y--;} if (m>11){m=0;y++;} S.ym=[y,m]; render(); }

function shareApp(){

  try{ navigator.clipboard.writeText(url).then(()=>toast(t('copied')), ()=>toast(url)); }catch(e){ toast(url); }
}
function calLink(p){
  const c = p.church==='all' ? null : churchOf(p.church);
  const d0 = p.date.replace(/-/g,''), d1 = (p.endDate && p.endDate>=p.date ? p.endDate : p.date).replace(/-/g,'');
  let dates;
  if (p.start){ const e = p.end || p.start; dates = `${d0}T${p.start.replace(':','')}00/${d1}T${e.replace(':','')}00`; }
  else dates = `${d0}/${addDays(p.endDate && p.endDate>=p.date ? p.endDate : p.date, 1).replace(/-/g,'')}`;
  const q = new URLSearchParams({ action:'TEMPLATE', text:`${L(p.title)} · FACT${c?' '+L(c.name):''}`, dates, ctz:'Asia/Taipei',
    details: L(p.body), location: c ? c.addr.en : '' });
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}
function toast(msg){
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent = msg; el.className = 'show'; clearTimeout(el._t); el._t = setTimeout(()=>el.className='', 2200);
}
